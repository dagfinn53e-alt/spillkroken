<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skiquiz – Spillglede</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#15364d;text-align:center;background:linear-gradient(180deg,#8fd4fb 0,#e8f7ff 35%,#fff 100%);background-attachment:fixed}
.wrap{max-width:900px;margin:auto;padding:12px}.hero{padding:12px 5px}h1{font-size:clamp(40px,8vw,68px);margin:4px;color:#fff;text-shadow:0 4px 0 #28698e,0 7px 16px #17425a80}.sub{font-size:18px;font-weight:900;color:#174c6b}
.panel{background:#fffffff2;border:4px solid #3e8db9;border-radius:25px;padding:14px;margin:12px auto;box-shadow:0 8px 0 #28698e,0 13px 25px #17425a35}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;align-items:center}.controls label{font-weight:900}select,button,a{border:0;border-radius:13px;padding:10px 13px;font-weight:900;font-size:15px}
select{background:#eef9ff;border:2px solid #7ebad9;color:#15364d}button{cursor:pointer}.new{background:#ffe36b;color:#17364c}.back{background:#17364c;color:#fff;text-decoration:none}
.levels{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:10px}.level{background:#d9effb;color:#15364d}.level.active{outline:4px solid #fff;box-shadow:0 0 0 6px #327fa9}.level[data-l="Lett"].active{background:#a9edb5}.level[data-l="Middels"].active{background:#ffe37b}.level[data-l="Vanskelig"].active{background:#ffb1a9}
.players{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.p{padding:9px 14px;border-radius:12px;background:#dceff9;font-weight:900;border:2px solid #83bad5}.p.on{background:#ffe36b;border-color:#d09e18;transform:scale(1.04)}
.progress{font-weight:900;color:#39718e}.q{font-size:clamp(22px,4vw,31px);font-weight:900;min-height:100px;display:flex;align-items:center;justify-content:center;padding:8px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.ans{min-height:65px;background:linear-gradient(#fff,#e8f6fd);color:#15364d;border:3px solid #559ac0;font-size:17px;box-shadow:0 4px 0 #34769a}.ans:disabled{opacity:1;color:#15364d}.ans.correct{background:#78df8a;border-color:#238b39;box-shadow:0 4px 0 #19712c}.ans.wrong{background:#ffe36b;border-color:#d5a51b;box-shadow:0 4px 0 #aa7f08}
.feedback{min-height:58px;padding:12px 4px 4px;font-size:17px;font-weight:900}.legend{font-size:13px;font-weight:bold;margin-top:8px}.green{color:#19712c}.yellow{color:#9a7200}
.overlay{display:none;position:fixed;inset:0;background:#092236dd;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.show{display:flex}.result{background:white;border:5px solid #55a1c9;border-radius:25px;padding:25px;max-width:450px;width:100%;box-shadow:0 10px 35px #0008}
@media(max-width:550px){.wrap{padding:7px}.panel{padding:9px;border-width:3px}.answers{grid-template-columns:1fr}.ans{min-height:54px}.q{min-height:85px}.sub{font-size:15px}}
</style></head><body><div class="wrap"><div class="hero"><h1>⛷️ SKIQUIZ</h1><div class="sub">Langrenn • skihopp • alpint • OL og VM</div></div>
<div class="panel controls"><label>Spillere <select id="np"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>Spørsmål <select id="nc"><option>10</option><option selected>20</option></select></label><button class="new" id="new">🔄 Ny quiz</button><a class="back" href="quiz.html">⬅ Quiz</a><div class="levels"><button class="level active" data-l="Lett">🟢 Lett</button><button class="level" data-l="Middels">🟡 Middels</button><button class="level" data-l="Vanskelig">🔴 Vanskelig</button><button class="level" data-l="Blandet">🎲 Blandet</button></div></div>
<div id="players" class="players"></div><div class="panel"><div id="prog" class="progress"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="fb" class="feedback"></div><div class="legend"><span class="green">■ GRØNN = riktig</span> &nbsp; <span class="yellow">■ GUL = ditt svar var feil</span></div></div></div>
<div id="over" class="overlay"><div class="result"><h2 id="res"></h2><button class="new" id="again">🎿 Spill igjen</button></div></div>
<script>
const DB={"Lett": [["Hvilket land representerte Gunde Svan?", ["Sverige", "Norge", "Finland", "Sveits"], 0], ["Har Marit Bjørgen vunnet OL-gull?", ["JA", "NEI"], 0], ["Hvilken idrett var Bjørn Wirkola mest kjent for?", ["Skihopping", "Alpint", "Langrenn", "Skiskyting"], 0], ["Representerte Alberto Tomba Italia?", ["JA", "NEI"], 0], ["Hvilket land representerte Noriaki Kasai?", ["Japan", "Finland", "Kina", "Sør-Korea"], 0], ["Var Ingemar Stenmark først og fremst langrennsløper?", ["JA", "NEI"], 1], ["Hvilken norsk løper har kallenavnet «Pølsa»?", ["Øystein Pettersen", "Petter Northug", "Thomas Alsgaard", "Oddvar Brå"], 0], ["Har Lindsey Vonn vunnet OL-gull i utfor?", ["JA", "NEI"], 0], ["Hvilken gren forbindes Jan Boklöv med?", ["Skihopping", "Langrenn", "Alpint", "Kombinert"], 0], ["Vant Bjørn Dæhlie åtte OL-gull?", ["JA", "NEI"], 0], ["Hvilket land representerte skihopperen Adam Małysz?", ["Polen", "Slovenia", "Østerrike", "Tsjekkia"], 0], ["Var Johan Olav Koss langrennsløper?", ["JA", "NEI"], 1], ["Hvilken gren var Alberto Tomba kjent for?", ["Alpint", "Langrenn", "Hopp", "Kombinert"], 0], ["Har Therese Johaug vunnet individuelt OL-gull?", ["JA", "NEI"], 0], ["Hvilken norsk alpinist ble kalt «The Attacking Viking»?", ["Aksel Lund Svindal", "Lasse Kjus", "Kjetil Jansrud", "Henrik Kristoffersen"], 0], ["Representerte Gunde Svan Norge?", ["JA", "NEI"], 1], ["Hvilken gren var Espen Bredesen kjent for?", ["Skihopping", "Alpint", "Langrenn", "Skiskyting"], 0], ["Har Simon Ammann vunnet olympisk gull i skihopping?", ["JA", "NEI"], 0], ["Hvilken norsk langrennsløper vant femmila i Vancouver-OL 2010?", ["Petter Northug", "Bjørn Dæhlie", "Thomas Alsgaard", "Vegard Ulvang"], 0], ["Er Holmenkollen kjent for både langrenn og skihopping?", ["JA", "NEI"], 0]], "Middels": [["Hvem vant OL-utfor for menn i Pyeongchang 2018?", ["Aksel Lund Svindal", "Kjetil Jansrud", "Beat Feuz", "Matthias Mayer"], 0], ["Vant Espen Bredesen OL-gull i storbakken på Lillehammer 1994?", ["JA", "NEI"], 1], ["Hvem vant Tour de Ski for kvinner 2013/14?", ["Therese Johaug", "Marit Bjørgen", "Justyna Kowalczyk", "Charlotte Kalla"], 0], ["Hvem vant OL-gull i super-G for menn i Sotsji 2014?", ["Kjetil Jansrud", "Aksel Lund Svindal", "Bode Miller", "Ted Ligety"], 0], ["Vant Thomas Alsgaard OL-gull på 30 km i Lillehammer 1994?", ["JA", "NEI"], 0], ["Hvem vant hoppuka tre år på rad fra 1966/67 til 1968/69?", ["Bjørn Wirkola", "Toralf Engan", "Espen Bredesen", "Jens Weissflog"], 0], ["Har Petter Northug vunnet individuelt OL-gull?", ["JA", "NEI"], 0], ["Hvilken nasjon representerte Justyna Kowalczyk?", ["Polen", "Tsjekkia", "Slovakia", "Slovenia"], 0], ["Vant Kjetil André Aamodt OL-gull i super-G i 1992?", ["JA", "NEI"], 0], ["Hvem vant normalbakken i OL på Lillehammer 1994?", ["Espen Bredesen", "Jens Weissflog", "Andreas Goldberger", "Matti Nykänen"], 0], ["Hvilken nasjon representerte langrennsløperen Dario Cologna?", ["Sveits", "Italia", "Østerrike", "Frankrike"], 0], ["Har Aksel Lund Svindal vunnet OL-gull i utfor?", ["JA", "NEI"], 0], ["Hvem vant kvinnenes første Tour de Ski i 2006/07?", ["Virpi Kuitunen", "Marit Bjørgen", "Justyna Kowalczyk", "Charlotte Kalla"], 0], ["Vant Oddvar Brå individuelt OL-gull?", ["JA", "NEI"], 1], ["Hvilken norsk alpinist vant OL-gull i super-G i 2002?", ["Kjetil André Aamodt", "Lasse Kjus", "Aksel Lund Svindal", "Kjetil Jansrud"], 0], ["Hvem vant storbakken i OL på Lillehammer 1994?", ["Jens Weissflog", "Espen Bredesen", "Andreas Goldberger", "Toni Nieminen"], 0], ["Har Jan Boklöv vunnet den totale verdenscupen i skihopping?", ["JA", "NEI"], 0], ["Hvilken nasjon representerte Virpi Kuitunen?", ["Finland", "Sverige", "Norge", "Estland"], 0], ["Vant Petter Northug 50 km klassisk i Vancouver 2010?", ["JA", "NEI"], 0], ["Hvem vant herreslalåmen i OL på Lillehammer 1994?", ["Thomas Stangassinger", "Alberto Tomba", "Kjetil André Aamodt", "Marc Girardelli"], 0]], "Vanskelig": [["Hvem vant herrenes verdenscup sammenlagt i langrenn 2017/18?", ["Dario Cologna", "Johannes Høsflot Klæbo", "Martin Johnsrud Sundby", "Alexander Bolsjunov"], 0], ["Vant Simon Ammann både normal- og storbakke i OL 2002?", ["JA", "NEI"], 0], ["Hvem vant OL-gull i super-G både i 1992 og 2002?", ["Kjetil André Aamodt", "Lasse Kjus", "Hermann Maier", "Aksel Lund Svindal"], 0], ["Hvem vant kvinnenes 30 km i OL i Beijing 2022?", ["Therese Johaug", "Jessie Diggins", "Kerttu Niskanen", "Frida Karlsson"], 0], ["Tok Marit Bjørgen tre gull under OL i Vancouver 2010?", ["JA", "NEI"], 0], ["Hvilken sveitsisk langrennsløper vant Tour de Ski fire ganger?", ["Dario Cologna", "Andi Grünenfelder", "Hippolyt Kempf", "Jason Rüesch"], 0], ["Hvem vant herrenes 50 km i ski-VM i Falun 2015?", ["Petter Northug", "Johan Olsson", "Dario Cologna", "Alex Harvey"], 0], ["Vant Aksel Lund Svindal OL-gull i super-G i Vancouver 2010?", ["JA", "NEI"], 0], ["Hvem vant storbakken individuelt i OL i Vancouver 2010?", ["Simon Ammann", "Adam Małysz", "Gregor Schlierenzauer", "Anders Jacobsen"], 0], ["Hvilken norsk hopper vant verdenscupen sammenlagt 1993/94?", ["Espen Bredesen", "Bjørn Wirkola", "Roar Ljøkelsøy", "Anders Bardal"], 0], ["Vant Therese Johaug Tour de Ski 2013/14?", ["JA", "NEI"], 0], ["Hvem vant kvinnenes OL-utfor i Vancouver 2010?", ["Lindsey Vonn", "Maria Riesch", "Julia Mancuso", "Anja Pärson"], 0], ["Hvilken nasjon representerte skihopperen Matti Nykänen?", ["Finland", "Sverige", "Norge", "Østerrike"], 0], ["Vant Kjetil Jansrud OL-gull i utfor i 2014?", ["JA", "NEI"], 1], ["Hvem vant herrenes 15 km klassisk i OL i Vancouver 2010?", ["Dario Cologna", "Petter Northug", "Lukáš Bauer", "Marcus Hellner"], 0], ["Har Kjetil André Aamodt fire olympiske gullmedaljer?", ["JA", "NEI"], 0], ["Hvem vant herrenes Tour de Ski 2014/15?", ["Petter Northug", "Martin Johnsrud Sundby", "Dario Cologna", "Alexander Legkov"], 0], ["Vant Petter Northug herrenes Tour de Ski 2014/15?", ["JA", "NEI"], 0], ["Hvem vant kvinnenes 10 km fristil i OL på Lillehammer 1994?", ["Ljubov Jegorova", "Manuela Di Centa", "Marit Mikkelsplass", "Stefania Belmondo"], 0], ["Var Simon Ammanns fire individuelle OL-gull fordelt på OL i 2002 og 2010?", ["JA", "NEI"], 0]]};let level="Lett",list=[],i=0,turn=0,n=2,score=[],locked=false,$=x=>document.getElementById(x);
function shuffle(a){for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function pool(){return level==="Blandet"?[...DB.Lett,...DB.Middels,...DB.Vanskelig]:[...DB[level]]}
function start(){n=+$("np").value;score=Array(n).fill(0);i=turn=0;locked=false;list=shuffle(pool()).slice(0,+$("nc").value);$("over").classList.remove("show");show()}
function playerbar(){$("players").innerHTML=score.map((s,j)=>`<div class="p ${j===turn?"on":""}">Spiller ${j+1}: ${s}</div>`).join("")}
function show(){if(i>=list.length)return finish();locked=false;let x=list[i],opts=x[1].map((v,j)=>({v,correct:j===x[2]}));if(opts.length>2)shuffle(opts);$("prog").textContent=`${level} • Spørsmål ${i+1} av ${list.length}`;$("q").textContent=x[0];$("answers").innerHTML="";$("fb").textContent="";opts.forEach(o=>{let b=document.createElement("button");b.className="ans";b.textContent=o.v;b.onclick=()=>answer(b,o,x[1][x[2]]);$("answers").appendChild(b)});playerbar()}
function answer(btn,o,right){if(locked)return;locked=true;document.querySelectorAll(".ans").forEach(b=>b.disabled=true);if(o.correct){btn.classList.add("correct");score[turn]++;$("fb").textContent="✅ Riktig svar!"}else{btn.classList.add("wrong");[...document.querySelectorAll(".ans")].find(b=>b.textContent===right)?.classList.add("correct");$("fb").textContent="🟡 Feil. Det riktige svaret er markert med grønt."}playerbar();setTimeout(()=>{turn=(turn+1)%n;i++;show()},1800)}
function finish(){let max=Math.max(...score),w=score.map((s,j)=>s===max?j+1:null).filter(Boolean);$("res").textContent=n===1?`⛷️ Du fikk ${score[0]} av ${list.length} poeng!`:w.length>1?`🤝 Uavgjort! ${max} poeng.`:`🏆 Spiller ${w[0]} vant med ${max} poeng!`;$("over").classList.add("show")}
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{level=b.dataset.l;document.querySelectorAll(".level").forEach(x=>x.classList.toggle("active",x===b));start()});
$("new").onclick=start;$("np").onchange=start;$("nc").onchange=start;$("again").onclick=start;start();
</script></body></html>
