<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo – Spillglede</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:radial-gradient(circle at top,#75431f,#29140b 72%);color:white;min-height:100vh}h1{text-align:center;color:#ffd85b;font-size:clamp(42px,8vw,76px);margin:15px 0 0;text-shadow:0 4px #54240b}.sub{text-align:center;font-weight:bold}.box{max-width:800px;margin:15px auto;padding:15px}.top,.actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.ball{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,white,#ffe36d,#d98b18);border:5px solid #6b310d;color:#32170b;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center}.btn{padding:10px 18px;border:3px solid #63300e;border-radius:25px;background:linear-gradient(#ffe477,#e7aa31);font-weight:900;color:#351a0b;text-decoration:none;cursor:pointer}.green{background:linear-gradient(#59d86a,#138631);color:white}.head,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:600px;margin:8px auto}.head div{text-align:center;color:#ffd85b;font-size:42px;font-weight:900}.cell{aspect-ratio:1;border:3px solid #71370f;border-radius:12px;background:#fff2c8;color:#35170a;font-size:clamp(22px,5vw,38px);font-weight:900}.cell.mark{background:#38ae50;color:white}.cell.hit{outline:4px solid #65db78}.free{background:#ffc94d}.msg,.history{text-align:center;font-weight:900;margin:14px}.history{line-height:1.8}.n{display:inline-flex;width:34px;height:34px;border-radius:50%;border:2px solid #e7ba4c;align-items:center;justify-content:center;margin:2px}.win{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center}.win.show{display:flex}.winbox{background:#ffe29a;color:#32170b;border:6px solid #6b310d;border-radius:25px;padding:30px;text-align:center}.winbox h2{font-size:44px;margin:0 0 10px}@media(max-width:600px){.box{padding:6px}.head,.grid{gap:3px}.cell{border-width:2px}.head div{font-size:32px}}</style></head>
<body><h1>🎱 BINGO</h1><div class="sub">75-talls Bingo – få en hel rekke, kolonne eller diagonal</div><div class="box">
<div class="top"><div class="ball" id="ball">–</div><div><b>Trukket: <span id="count">0</span> / 75</b><br><span id="call">Klar til start</span></div><button class="btn green" onclick="draw()">🎱 Trekk tall</button></div>
<div class="head"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div class="grid" id="grid"></div>
<div class="msg" id="msg">Trekk et tall. Klikk på tallet på brettet hvis du har det.</div><div class="actions"><button class="btn" onclick="check()">🎉 BINGO!</button><button class="btn" onclick="start()">🔄 Nytt spill</button><a class="btn" href="index.html">🏠 Spillglede</a></div>
<div class="history"><b>Trukne tall:</b><br><span id="hist">Ingen ennå</span></div></div>
<div class="win" id="win"><div class="winbox"><h2>🎉 BINGO!</h2><p id="result"></p><button class="btn green" onclick="start()">Spill igjen</button></div></div>
<script>
let b=[],pool=[],drawn=[],marked=new Set();const L=['B','I','N','G','O'];
function pick(a,z,n){let x=[];for(let i=a;i<=z;i++)x.push(i);x.sort(()=>Math.random()-.5);return x.slice(0,n).sort((a,b)=>a-b)}
function start(){b=[];for(let c=0;c<5;c++){let x=pick(c*15+1,c*15+15,5);for(let r=0;r<5;r++)b[r*5+c]=x[r]}b[12]='FREE';pool=Array.from({length:75},(_,i)=>i+1).sort(()=>Math.random()-.5);drawn=[];marked=new Set([12]);ball.textContent='–';count.textContent=0;call.textContent='Klar til start';hist.textContent='Ingen ennå';msg.textContent='Trekk et tall. Klikk på tallet på brettet hvis du har det.';win.classList.remove('show');render()}
function render(){grid.innerHTML='';b.forEach((v,i)=>{let e=document.createElement('button');e.className='cell'+(i===12?' free mark':'')+(drawn.includes(v)?' hit':'')+(marked.has(i)&&i!==12?' mark':'');e.textContent=i===12?'GRATIS':v;e.onclick=()=>mark(i);grid.appendChild(e)})}
function draw(){if(!pool.length)return;let n=pool.pop();drawn.push(n);let l=L[Math.floor((n-1)/15)];ball.textContent=l+n;call.textContent=l+' '+n+' er trukket';count.textContent=drawn.length;hist.innerHTML=drawn.slice().reverse().map(x=>'<span class="n">'+x+'</span>').join('');msg.textContent='Se om '+n+' finnes på brettet.';render()}
function mark(i){if(i===12)return;if(!drawn.includes(b[i])){msg.textContent='Dette tallet er ikke trukket ennå.';return}marked.has(i)?marked.delete(i):marked.add(i);render()}
function bingo(){for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>marked.has(r*5+c)))return true;for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>marked.has(r*5+c)))return true;return [0,6,12,18,24].every(i=>marked.has(i))||[4,8,12,16,20].every(i=>marked.has(i))}
function check(){if(bingo()){result.textContent='Du fikk Bingo etter '+drawn.length+' trukne tall!';win.classList.add('show')}else msg.textContent='Ikke Bingo ennå – fortsett å trekke tall.'}start();
</script></body></html>
