<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo – Spillglede</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:white;
background:radial-gradient(circle at 50% 0,#075397,#03182f 68%);
display:flex;align-items:center;justify-content:center;padding:22px}
.wrap{width:min(1050px,100%);text-align:center}
h1{font-size:clamp(42px,8vw,82px);margin:0 0 8px;font-weight:1000;letter-spacing:3px}
p{font-size:20px;margin:0 0 28px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.game{display:block;text-decoration:none;color:white;border:4px solid rgba(255,255,255,.5);
border-radius:28px;padding:34px 18px;box-shadow:0 12px 30px #0008;transition:.15s}
.game:hover{transform:translateY(-4px);border-color:white}
.normal{background:linear-gradient(135deg,#0877df,#06447f)}
.music{background:linear-gradient(135deg,#8b2bd1,#d33675)}
.icon{font-size:72px;display:block}
.name{font-size:32px;font-weight:1000;display:block;margin-top:8px}
.desc{font-size:18px;font-weight:700;display:block;margin-top:10px}
.back{display:inline-block;margin-top:28px;color:white;text-decoration:none;font-weight:900;
background:#07549a;border:2px solid #24a9ff;border-radius:15px;padding:11px 18px}
@media(max-width:650px){.games{grid-template-columns:1fr}.game{padding:24px 14px}.icon{font-size:58px}.name{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎱 BINGO</h1>
<p>Velg hvilket Bingo-spill dere vil spille</p>
<div class="games">
<a class="game normal" href="vanlig-bingo.html">
<span class="icon">🎱</span><span class="name">Vanlig Bingo</span>
<span class="desc">4 spillere</span></a>
<a class="game music" href="musikkbingo.html">
<span class="icon">🎵</span><span class="name">Musikkbingo</span>
<span class="desc">2 spillere – to brett ved siden av hverandre</span></a>
</div>
<a class="back" href="index.html">🏠 Tilbake til Spillglede</a>
</div>
</body>
</html>
