<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordjakt – Spillglede</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e9f7ff,#fff7d8);color:#17324d;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:12px;text-align:center}
h1{font-size:clamp(38px,8vw,64px);margin:8px 0;color:#155f9b}
.sub{font-weight:700;margin:0 0 12px}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:3px solid #155f9b;border-radius:16px;background:#fff;color:#17415f;padding:10px 15px;font-size:16px;font-weight:900;cursor:pointer;text-decoration:none}
.btn.primary{background:#ffd85a}.langbtn.active,.levelbtn.active{background:#70dc88;border-color:#28723a}
.info{display:flex;justify-content:space-between;gap:8px;max-width:560px;margin:8px auto;font-weight:900}
.board{display:grid;grid-template-columns:repeat(var(--size,8),1fr);gap:4px;max-width:560px;margin:10px auto;background:#155f9b;padding:7px;border-radius:18px;touch-action:manipulation}
.cell{aspect-ratio:1;min-width:0;padding:0;border:0;border-radius:9px;background:#fff;color:#18364d;font-size:clamp(18px,5vw,30px);font-weight:1000;cursor:pointer}
.cell.selected{background:#ffe15a;outline:3px solid #e19b00}
.cell.found{background:#70dc88;color:#073d16;outline:none}
.words{max-width:560px;margin:12px auto;background:#fff;border:3px solid #8cc9ee;border-radius:18px;padding:10px}
.words h2{margin:0 0 8px}
.wordlist{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.word{padding:7px;border-radius:10px;background:#e9f6ff;font-weight:900}
.word.done{text-decoration:line-through;background:#d8f7df;color:#28723a}
#msg{min-height:28px;font-weight:900;color:#a04d00;margin:8px}
.win{display:none;background:#fff2a8;border:4px solid #e0a000;border-radius:20px;padding:18px;max-width:500px;margin:12px auto;font-weight:900;font-size:22px}
.win.show{display:block}
@media(max-width:500px){
.wrap{padding:7px}.board{gap:2px;padding:4px}.cell{border-radius:6px;font-size:clamp(12px,4.8vw,20px)}
.wordlist{grid-template-columns:repeat(2,1fr)}.btn{padding:9px 11px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🔤 ORD-JAKT</h1>
<p class="sub">Finn de skjulte norske ordene</p>
<div class="top">
<a class="btn" href="index.html">🏠 Spillglede</a>
<button class="btn primary" id="new">🔄 Nytt brett</button><button class="btn langbtn active" id="noBtn">🇳🇴 NORSK</button><button class="btn langbtn" id="enBtn">🇬🇧 ENGLISH</button>
</div>
<div class="top levels">
<button class="btn levelbtn active" data-level="easy">🟢 LETT</button>
<button class="btn levelbtn" data-level="medium">🟡 MIDDELS</button>
<button class="btn levelbtn" data-level="hard">🔴 VANSKELIG</button>
</div>
<div class="info"><span>Funnet: <b id="score">0</b>/<b id="goal">8</b></span><span>⏱️ <b id="time">0:00</b></span></div>
<div id="board" class="board"></div>
<div id="msg">Trykk på første bokstav og deretter siste bokstav i ordet.</div>
<div class="words"><h2>Finn disse ordene:</h2><div id="wordlist" class="wordlist"></div></div>
<div id="win" class="win">🎉 Fantastisk! Du fant alle ordene!<br><button class="btn primary" id="again" style="margin-top:12px">Nytt brett</button></div>
</div>
<script>
let SIZE=8, level="easy";
const banksNO={
easy:[
["HUND","KATT","FISK","FUGL","BALL","SOL","SKO","BIL"],["EPLER","BANAN","MELK","BRØD","OST","SAFT","KOPP","GLASS"],
["BOK","SANG","DANS","FILM","QUIZ","ORD","LEK","SPILL"],["HUS","BORD","STOL","LAMPE","DØR","TAK","SENG","SOFA"],
["BÅT","TOG","BUSS","SYKKEL","VEI","BRO","HJUL","TUR"],["RØD","BLÅ","GRØNN","GUL","ROSA","HVIT","SORT","BRUN"]
],
medium:[
["SOMMER","VINTER","HØSTEN","VÅREN","REGNET","VINDEN","FJELLET","STRANDA","SKOGEN","ELVEN"],
["KJØKKEN","STUE","SOVEROM","VINDU","TRAPP","HAGE","GARASJE","TEPPE","HYLLER","KLOKKE"],
["NORDLYS","FJORDER","VIKING","TROLL","HYTTE","SKIFERIE","BUNAD","FOSSEFALL","KYSTEN","MIDNATT"],
["GITAR","PIANO","TROMMER","FIOLIN","SANGER","MELODI","RYTME","KONSERT","MUSIKK","DANSER"],
["POTETER","GULROT","TOMATER","AGURK","JORDBÆR","APPELSIN","FROKOST","MIDDAG","KAFFE","KAKAO"]
],
hard:[
["EVENTYR","HEMMELIG","OPPDAGELSE","UTFORDRING","KUNNSKAP","HUKOMMELSE","FANTASI","HISTORIE","SPØRSMÅL","LØSNINGEN","MYSTERIUM","OVERRASKELSE"],
["FJELLTOPP","VINTERDAG","SOMMERFERIE","REGNBUE","HAVBØLGER","SKOGSTUR","SOLNEDGANG","NORDLYSET","FOSSEFALL","KYSTLINJE","UTSIKTEN","NATURGLEDE"],
["BOKSTAVER","ORDJAKTEN","HJERNETRIM","TALLREKKER","PUSLESPILL","KRYSSORD","SPILLGLEDE","TENKEEVNE","KONSENTRASJON","UTFORSKING","KREATIVITET","UTFORDRINGER"]
]};
const banksEN={
easy:[
["DOG","CAT","FISH","BIRD","BALL","SUN","SHOE","CAR"],["APPLE","BANANA","MILK","BREAD","CHEESE","JUICE","CUP","GLASS"],
["BOOK","SONG","DANCE","FILM","QUIZ","WORD","GAME","PLAY"],["HOUSE","TABLE","CHAIR","LAMP","DOOR","ROOF","BED","SOFA"],
["BOAT","TRAIN","BUS","BIKE","ROAD","BRIDGE","WHEEL","TRIP"],["RED","BLUE","GREEN","YELLOW","PINK","WHITE","BLACK","BROWN"]
],
medium:[
["SUMMER","WINTER","AUTUMN","SPRING","RAIN","WINDY","MOUNTAIN","BEACH","FOREST","RIVER"],
["KITCHEN","LIVING","BEDROOM","WINDOW","STAIRS","GARDEN","GARAGE","CARPET","SHELF","CLOCK"],
["GUITAR","PIANO","DRUMS","VIOLIN","SINGER","MELODY","RHYTHM","CONCERT","MUSIC","DANCER"],
["POTATO","CARROT","TOMATO","CUCUMBER","STRAWBERRY","ORANGE","BREAKFAST","DINNER","COFFEE","COCOA"],
["FAMILY","FRIEND","SCHOOL","HOLIDAY","AIRPORT","COUNTRY","VILLAGE","FLOWER","ANIMAL","MARKET"]
],
hard:[
["ADVENTURE","MYSTERY","DISCOVERY","CHALLENGE","KNOWLEDGE","MEMORY","IMAGINATION","HISTORY","QUESTION","SOLUTION","SURPRISE","EXPLORER"],
["MOUNTAINS","WINTERDAY","SUMMERHOLIDAY","RAINBOW","OCEANWAVES","FORESTWALK","SUNSET","WATERFALL","COASTLINE","LANDSCAPE","NATURE","NORTHERNLIGHT"],
["LETTERS","WORDSEARCH","BRAINTRAINING","NUMBERSEQUENCE","PUZZLEGAME","CROSSWORD","GAMEJOY","THINKING","CONCENTRATION","EXPLORATION","CREATIVITY","CHALLENGES"]
]};
let language="NO";
let grid,words,placed,first=null,found=new Set(),seconds=0,timer=null;
const dirs=[[1,0],[0,1],[1,1],[-1,1]];
function blank(){return Array.from({length:SIZE},()=>Array(SIZE).fill(""))}
function canPlace(w,x,y,dx,dy,g){
 for(let i=0;i<w.length;i++){let xx=x+dx*i,yy=y+dy*i;if(xx<0||yy<0||xx>=SIZE||yy>=SIZE)return false;if(g[yy][xx]&&g[yy][xx]!==w[i])return false}return true
}
function make(){
 let tries=0, success=false;
 while(!success && tries<100){
  tries++;
  let allBanks=language==="NO"?banksNO:banksEN;
 let banks=allBanks[level];
 words=[...banks[Math.floor(Math.random()*banks.length)]];
  grid=blank();placed=[];success=true;
  for(const word of words){
   let ok=false;
   for(let t=0;t<1000&&!ok;t++){
    let [dx,dy]=dirs[Math.floor(Math.random()*dirs.length)];
    let rev=Math.random()<.35; let w=rev?[...word].reverse().join(""):word;
    let maxX=dx===1?SIZE-w.length:dx===-1?SIZE-1:SIZE-1;
    let minX=dx===-1?w.length-1:0;
    let maxY=dy===1?SIZE-w.length:SIZE-1;
    let minY=0;
    if(maxX<minX||maxY<minY)continue;
    let x=minX+Math.floor(Math.random()*(maxX-minX+1));
    let y=minY+Math.floor(Math.random()*(maxY-minY+1));
    if(canPlace(w,x,y,dx,dy,grid)){
     let cells=[];
     for(let i=0;i<w.length;i++){let xx=x+dx*i,yy=y+dy*i;grid[yy][xx]=w[i];cells.push(yy*SIZE+xx)}
     placed.push({word,cells});ok=true;
    }
   }
   if(!ok){success=false;break}
  }
 }
 if(!success){document.getElementById('msg').textContent="Kunne ikke lage brettet. Trykk Nytt brett.";return}
 const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ";
 for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(!grid[y][x])grid[y][x]=letters[Math.floor(Math.random()*letters.length)];
 found.clear();first=null;seconds=0;document.getElementById('goal').textContent=words.length;document.getElementById('board').style.setProperty('--size',SIZE);clearInterval(timer);timer=setInterval(()=>{seconds++;showTime()},1000);
 document.getElementById('win').classList.remove("show");
 document.getElementById('msg').textContent="Trykk på første bokstav og deretter siste bokstav i ordet.";
 render();showTime();
}
function showTime(){document.getElementById('time').textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0")}
function lineCells(a,b){
 let ax=a%SIZE,ay=Math.floor(a/SIZE),bx=b%SIZE,by=Math.floor(b/SIZE),dx=Math.sign(bx-ax),dy=Math.sign(by-ay);
 let len=Math.max(Math.abs(bx-ax),Math.abs(by-ay))+1;
 if(!((ax===bx)||(ay===by)||(Math.abs(bx-ax)===Math.abs(by-ay))))return [];
 let arr=[];for(let i=0;i<len;i++)arr.push((ay+dy*i)*SIZE+(ax+dx*i));return arr;
}
function pick(i){
 if(first===null){first=i;document.getElementById('msg').textContent="Velg siste bokstav.";render();return}
 let cells=lineCells(first,i),hit=placed.find(p=>!found.has(p.word)&&(same(cells,p.cells)||same([...cells].reverse(),p.cells)));
 if(hit){found.add(hit.word);document.getElementById('msg').textContent="✅ Riktig! Du fant "+hit.word+".";if(found.size===words.length){clearInterval(timer);document.getElementById('win').classList.add("show")}}
 else document.getElementById('msg').textContent="Ikke et av ordene – prøv igjen.";
 first=null;render();
}
function same(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i])}
function render(){
 document.getElementById('board').innerHTML="";
 let foundCells=new Set();placed.filter(p=>found.has(p.word)).forEach(p=>p.cells.forEach(c=>foundCells.add(c)));
 grid.flat().forEach((ch,i)=>{let b=document.createElement("button");b.className="cell"+(i===first?" selected":"")+(foundCells.has(i)?" found":"");b.textContent=ch;b.onclick=()=>pick(i);document.getElementById('board').appendChild(b)});
 document.getElementById('wordlist').innerHTML=words.map(w=>'<div class="word '+(found.has(w)?'done':'')+'">'+w+'</div>').join("");
 document.getElementById('score').textContent=found.size;
}
document.getElementById('new').onclick=make;
document.getElementById('again').onclick=()=>{document.getElementById('win').classList.remove("show");make()};
function setLanguage(lang){
 language=lang;
 document.getElementById('noBtn').classList.toggle('active',lang==="NO");
 document.getElementById('enBtn').classList.toggle('active',lang==="EN");
 document.querySelector(".sub").textContent=lang==="NO"?"Finn de skjulte norske ordene":"Find the hidden English words";
 document.querySelector(".words h2").textContent=lang==="NO"?"Finn disse ordene:":"Find these words:";
 make();
}
document.getElementById('noBtn').onclick=()=>setLanguage("NO");
document.getElementById('enBtn').onclick=()=>setLanguage("EN");
document.querySelectorAll('.levelbtn').forEach(btn=>btn.onclick=()=>{
 level=btn.dataset.level;
 SIZE=level==="easy"?8:level==="medium"?10:12;
 document.querySelectorAll('.levelbtn').forEach(x=>x.classList.toggle('active',x===btn));
 make();
});
make();
</script>
</body></html>
