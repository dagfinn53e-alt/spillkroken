<script>
const BANK={"NO": {"Lett": [["Hvem har katten?", ["Anne har ikke katten.", "Bjørn har hunden.", "Cecilie har verken hunden eller fisken.", "De tre har ett dyr hver: katt, hund og fisk."], ["Anne", "Bjørn", "Cecilie"], 2, "Bjørn har hunden. Cecilie kan ikke ha hund eller fisk, så Cecilie må ha katten."], ["Hvem kom først i mål?", ["Liv kom før Tom.", "Tom kom før Eva.", "Ingen kom likt."], ["Liv", "Tom", "Eva"], 0, "Liv kom før Tom, og Tom kom før Eva. Liv kom derfor først."], ["Hvem sitter i midten?", ["Ada, Bo og Cam sitter på tre stoler på rekke.", "Ada sitter til venstre for Bo.", "Cam sitter til høyre for Bo."], ["Ada", "Bo", "Cam"], 1, "Bo må sitte mellom Ada og Cam."], ["Hvilken bok er tykkest?", ["Bok A er tykkere enn bok B.", "Bok C er tynnere enn bok B."], ["Bok A", "Bok B", "Bok C"], 0, "A er tykkere enn B, og B er tykkere enn C."], ["Hvem bor øverst?", ["Mona bor høyere enn Pål.", "Pål bor høyere enn Rune.", "De bor i hver sin etasje."], ["Mona", "Pål", "Rune"], 0, "Mona bor over Pål, som bor over Rune."], ["Hvilken drikk valgte Nora?", ["Nora, Erik og Ida valgte kaffe, te og vann – én hver.", "Erik valgte kaffe.", "Ida valgte ikke vann."], ["Kaffe", "Te", "Vann"], 2, "Erik har kaffe. Ida må ha te, så Nora får vann."], ["Hvilken dag trener Sara?", ["Sara, Jon og Mia trener mandag, tirsdag og onsdag – én dag hver.", "Jon trener mandag.", "Mia trener dagen etter Sara."], ["Mandag", "Tirsdag", "Onsdag"], 1, "Jon har mandag. Sara må da ha tirsdag og Mia onsdag."], ["Hvem eier den røde bilen?", ["Ali, Bea og Carl har rød, blå og hvit bil – én hver.", "Bea har blå bil.", "Carl har ikke hvit bil."], ["Ali", "Bea", "Carl"], 2, "Bea har blå. Carl kan ikke ha hvit, så Carl må ha rød."], ["Hvilken frukt valgte Emil?", ["Emil, Lise og Jan valgte eple, pære og banan – én hver.", "Lise valgte pære.", "Jan valgte ikke banan."], ["Eple", "Pære", "Banan"], 2, "Lise har pære. Jan må ha eple, så Emil får banan."], ["Hvem er yngst?", ["Kari er eldre enn Per.", "Per er eldre enn Silje."], ["Kari", "Per", "Silje"], 2, "Silje er yngre enn Per, som er yngre enn Kari."], ["Hvem har sykkelen?", ["Ola, Pia og Jens har sykkel, sparkesykkel og rulleskøyter – én hver.", "Pia har rulleskøyter.", "Jens har ikke sykkel."], ["Ola", "Pia", "Jens"], 0, "Pia har rulleskøyter. Jens må ha sparkesykkel, så Ola har sykkelen."], ["Hvem står lengst til høyre?", ["Eva står til venstre for Lars.", "Lars står til venstre for Nina."], ["Eva", "Lars", "Nina"], 2, "Rekkefølgen er Eva, Lars, Nina."], ["Hvilken farge har kopp B?", ["Kopp A, B og C er rød, gul og blå – én hver.", "A er rød.", "C er ikke blå."], ["Rød", "Gul", "Blå"], 2, "A er rød. C må være gul, så B er blå."], ["Hvem tok toget?", ["Arne, Bente og Cato reiste med tog, buss og bil – én hver.", "Bente tok bussen.", "Cato tok ikke toget."], ["Arne", "Bente", "Cato"], 0, "Bente har buss. Cato må ha bil, så Arne tok toget."], ["Hvilken kake valgte Liv?", ["Liv, Tom og Eva valgte sjokolade, bløtkake og eplekake – én hver.", "Tom valgte sjokolade.", "Eva valgte ikke eplekake."], ["Sjokolade", "Bløtkake", "Eplekake"], 2, "Tom har sjokolade. Eva må ha bløtkake, så Liv får eplekake."]], "Middels": [["Hvem bor i det grønne huset?", ["Kari bor i det røde huset.", "Ola bor ikke i det grønne huset.", "Per bor ikke i det røde huset.", "De bor i rødt, blått og grønt hus – ett hver."], ["Kari", "Ola", "Per"], 2, "Kari har rødt. Ola kan ikke ha grønt, så Ola har blått og Per grønt."], ["Hvem kom på andreplass?", ["Anna kom før Bjørn.", "Cato kom etter Bjørn.", "Dina kom etter Cato."], ["Anna", "Bjørn", "Cato", "Dina"], 1, "Rekkefølgen må være Anna, Bjørn, Cato, Dina."], ["Hvem drikker te?", ["Ada, Bo, Cam og Dina drikker kaffe, te, vann og juice – én hver.", "Ada drikker kaffe.", "Bo drikker juice.", "Cam drikker vann."], ["Ada", "Bo", "Cam", "Dina"], 3, "Kaffe, juice og vann er tatt. Te står igjen til Dina."], ["Hvilket nummer har Sara?", ["Fire løpere har nummer 1–4.", "Sara har høyere nummer enn Jon.", "Mia har nummer 1.", "Jon har nummer 2.", "Per har nummer 4."], ["1", "2", "3", "4"], 2, "Mia har 1, Jon 2 og Per 4. Sara må ha 3."], ["Hvem har nøkkelen?", ["Erik, Frida, Geir og Hilde har nøkkel, kart, lykt og tau – én ting hver.", "Frida har kartet.", "Geir har lykten.", "Hilde har ikke nøkkelen."], ["Erik", "Frida", "Geir", "Hilde"], 0, "Kart og lykt er tatt. Hilde kan ikke ha nøkkel, så Hilde har tau og Erik nøkkelen."], ["Hvilken etasje bor Ida i?", ["Ida, Jan, Kim og Liv bor i etasje 1–4 – én hver.", "Jan bor i 1.", "Kim bor over Ida.", "Liv bor i 4.", "Ida bor ikke i 3."], ["1", "2", "3", "4"], 1, "Jan har 1 og Liv 4. Ida kan ikke ha 3, så Ida må ha 2 og Kim 3."], ["Hvem valgte suppe?", ["Anne, Berit, Carl og Dag valgte suppe, salat, fisk og pasta – én hver.", "Anne valgte fisk.", "Berit valgte salat.", "Carl valgte ikke suppe."], ["Anne", "Berit", "Carl", "Dag"], 3, "Fisk og salat er tatt. Carl kan ikke ha suppe, så Carl har pasta og Dag suppe."], ["Hvilken by besøkte Pia?", ["Pia, Rune, Sara og Tom besøkte Oslo, Bergen, Tromsø og Stavanger – én hver.", "Rune besøkte Bergen.", "Sara besøkte Tromsø.", "Tom besøkte ikke Stavanger."], ["Oslo", "Bergen", "Tromsø", "Stavanger"], 3, "Bergen og Tromsø er tatt. Tom kan ikke ha Stavanger, så Tom får Oslo og Pia Stavanger."], ["Hvem har den største hunden?", ["Alf sin hund er større enn Bea sin.", "Bea sin hund er større enn Carl sin.", "Dina sin hund er mindre enn Carl sin."], ["Alf", "Bea", "Carl", "Dina"], 0, "Alf > Bea > Carl > Dina."], ["Hvem jobber onsdag?", ["Eli, Finn og Grete jobber mandag, tirsdag og onsdag – én dag hver.", "Finn jobber før Grete.", "Eli jobber mandag."], ["Eli", "Finn", "Grete"], 2, "Eli har mandag. Finn må være tirsdag og Grete onsdag."], ["Hvilken gave fikk Nora?", ["Nora, Oda, Per og Rolf fikk bok, klokke, skjerf og spill – én hver.", "Oda fikk bok.", "Per fikk spill.", "Rolf fikk ikke skjerf."], ["Bok", "Klokke", "Skjerf", "Spill"], 2, "Bok og spill er tatt. Rolf kan ikke ha skjerf, så Rolf har klokke og Nora skjerf."], ["Hvem står først i køen?", ["Lars står foran Mona.", "Mona står foran Nils.", "Oda står bak Nils."], ["Lars", "Mona", "Nils", "Oda"], 0, "Lars står foran Mona, Nils og Oda."], ["Hvilken stol sitter Eva på?", ["Stolene er nummerert 1–4 fra venstre.", "Eva sitter til venstre for Finn.", "Gerd sitter på stol 1.", "Finn sitter på stol 3.", "Hans sitter på stol 4."], ["1", "2", "3", "4"], 1, "Gerd har 1, Finn 3 og Hans 4. Eva må sitte på 2."], ["Hvem har paraplyen?", ["Ina, Jo, Kai og Lea har paraply, hatt, skjerf og hansker – én ting hver.", "Jo har hatten.", "Kai har skjerfet.", "Lea har ikke paraplyen."], ["Ina", "Jo", "Kai", "Lea"], 0, "Hatt og skjerf er tatt. Lea kan ikke ha paraply, så Lea har hansker og Ina paraply."], ["Hvilken dessert valgte Tom?", ["Tom, Ulla, Vera og Willy valgte is, kake, frukt og pudding – én hver.", "Ulla valgte kake.", "Vera valgte frukt.", "Willy valgte ikke pudding."], ["Is", "Kake", "Frukt", "Pudding"], 3, "Kake og frukt er tatt. Willy kan ikke ha pudding, så Willy får is og Tom pudding."]], "Vanskelig": [["Hvem bor i hus nummer 3?", ["Fire hus står på rekke 1–4.", "Anne bor rett til venstre for Bjørn.", "Cecilie bor i hus 1.", "Dag bor ikke i hus 4.", "Bjørn bor ikke i hus 2."], ["Anne", "Bjørn", "Cecilie", "Dag"], 1, "Cecilie har 1. Anne og Bjørn må stå ved siden av hverandre, Anne til venstre. Bjørn kan ikke ha 2, så paret må være 2–3. Bjørn bor i 3."], ["Hvem kom på tredjeplass?", ["Fem løpere: Ada, Bo, Cam, Dina og Erik.", "Ada kom før Bo.", "Cam kom rett etter Bo.", "Dina kom først.", "Erik kom sist."], ["Ada", "Bo", "Cam", "Dina", "Erik"], 1, "Dina er først og Erik sist. Bo og Cam må stå sammen med Cam rett etter. Ada må være før Bo. Dermed Ada 2, Bo 3, Cam 4."], ["Hvilken dag har Per fri?", ["Per jobber fire av dagene mandag–fredag.", "Han jobber mandag.", "Han jobber dagen før og dagen etter onsdag.", "Han jobber fredag."], ["Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag"], 2, "Dagen før og etter onsdag er tirsdag og torsdag. Sammen med mandag og fredag er de fire arbeidsdagene, så onsdag er fri."], ["Hvem har rom 4?", ["Fire gjester har rom 1–4.", "Nils har rom 1.", "Liv har rom 2.", "Mona har høyere romnummer enn Liv.", "Oda har høyere romnummer enn Mona."], ["Liv", "Mona", "Nils", "Oda"], 3, "Nils=1 og Liv=2. Mona må ligge over Liv, og Oda over Mona. Derfor Mona=3 og Oda=4."], ["Hvilken boks inneholder gull?", ["Tre bokser A, B og C. Bare én påstand er sann.", "A: Gullet er i B.", "B: Gullet er ikke i B.", "C: Gullet er ikke i A."], ["A", "B", "C"], 0, "Hvis gullet er i A: A sin påstand er falsk, B sin er sann, C sin er falsk – nøyaktig én sann."], ["Hvem er legen?", ["Arne, Bente, Carl og Dina har yrkene lege, lærer, kokk og pilot – ett hver.", "Arne er ikke lege eller pilot.", "Bente er lærer.", "Carl er ikke kokk.", "Dina er pilot."], ["Arne", "Bente", "Carl", "Dina"], 2, "Bente er lærer og Dina pilot. Arne kan ikke lege/pilot og lærer er tatt, så Arne er kokk. Carl er legen."], ["Hvilken farge har hus 2?", ["Fire hus har fargene rød, blå, gul og grønn – én hver.", "Hus 1 er rødt.", "Det blå huset står rett til venstre for det gule.", "Hus 4 er grønt."], ["Rød", "Blå", "Gul", "Grønn"], 1, "1 er rød og 4 grønn. Blå må stå rett før gul, så de må være hus 2 og 3."], ["Hvem spiller piano?", ["Eva, Finn, Gerd og Hans spiller piano, gitar, trommer og fiolin – ett instrument hver.", "Eva spiller gitar.", "Finn spiller fiolin.", "Gerd spiller trommer."], ["Eva", "Finn", "Gerd", "Hans"], 3, "Gitar, fiolin og trommer er tatt. Piano står igjen til Hans."], ["Hvilken konvolutt er riktig?", ["Tre konvolutter A, B og C. Bare én tekst er sann.", "A sier: Premien er ikke i A.", "B sier: Premien er i A.", "C sier: Premien er ikke i B."], ["A", "B", "C"], 1, "Hvis premien er i B: A er sann, B er falsk, C er falsk. Da er nøyaktig én tekst sann."], ["Hvem tok siste buss?", ["Anna dro før Bjørn.", "Cato dro etter Dina.", "Bjørn dro før Dina.", "Eva dro etter Cato."], ["Anna", "Bjørn", "Cato", "Dina", "Eva"], 4, "Kjeden blir Anna < Bjørn < Dina < Cato < Eva. Eva dro sist."], ["Hvilket tall mangler?", ["A er dobbelt så stort som B.", "B er 3 større enn C.", "C er 4.", "Finn A."], ["10", "12", "14", "16"], 2, "C=4. B=7. A er dobbelt av B, altså 14."], ["Hvem har den grønne mappen?", ["Fire personer har rød, blå, gul og grønn mappe.", "Ada har rød.", "Bo har ikke blå eller grønn.", "Cam har blå."], ["Ada", "Bo", "Cam", "Dina"], 3, "Ada har rød og Cam blå. Bo kan ikke blå/grønn, så Bo må ha gul. Dina får grønn."], ["Hvilket sete har Nora?", ["Setene 1–5 står på rekke.", "Ola sitter på 1.", "Per sitter rett til høyre for Nora.", "Rune sitter på 5.", "Sara sitter på 2."], ["1", "2", "3", "4", "5"], 2, "1, 2 og 5 er opptatt. Nora og Per må sitte ved siden av hverandre, så de må ha 3 og 4. Nora har 3."], ["Hvem er eldst?", ["Ane er yngre enn Bård.", "Cecilie er eldre enn Bård.", "Dag er yngre enn Ane.", "Eva er eldre enn Cecilie."], ["Ane", "Bård", "Cecilie", "Dag", "Eva"], 4, "Eva > Cecilie > Bård > Ane > Dag."], ["Hvilken dør fører ut?", ["Tre dører A, B og C. Bare én vakt snakker sant.", "Vakt A: Dør A fører ut.", "Vakt B: Dør A fører ikke ut.", "Vakt C: Dør C fører ikke ut."], ["Dør A", "Dør B", "Dør C"], 2, "Hvis C fører ut: A er falsk, B er sann og C er falsk. Nøyaktig én vakt snakker sant."]]}, "EN": {"Easy": [["Who has the cat?", ["Anne does not have the cat.", "Bjørn has the dog.", "Cecilie has neither the dog nor the fish.", "Each person has one pet: cat, dog or fish."], ["Anne", "Bjørn", "Cecilie"], 2, "Bjørn has the dog. Cecilie cannot have the dog or fish, so she must have the cat."], ["Who finished first?", ["Liv finished before Tom.", "Tom finished before Eva.", "Nobody tied."], ["Liv", "Tom", "Eva"], 0, "Liv was before Tom, and Tom before Eva. Liv was first."], ["Who sits in the middle?", ["Ada, Bo and Cam sit in a row.", "Ada sits left of Bo.", "Cam sits right of Bo."], ["Ada", "Bo", "Cam"], 1, "Bo must sit between Ada and Cam."], ["Which book is thickest?", ["Book A is thicker than Book B.", "Book C is thinner than Book B."], ["Book A", "Book B", "Book C"], 0, "A is thicker than B, and B is thicker than C."], ["Who lives on the top floor?", ["Mona lives above Paul.", "Paul lives above Ruby.", "They live on different floors."], ["Mona", "Paul", "Ruby"], 0, "Mona is above Paul, who is above Ruby."], ["What did Nora drink?", ["Nora, Erik and Ida chose coffee, tea and water – one each.", "Erik chose coffee.", "Ida did not choose water."], ["Coffee", "Tea", "Water"], 2, "Erik has coffee. Ida must have tea, leaving water for Nora."], ["Which day does Sara train?", ["Sara, Jon and Mia train Monday, Tuesday and Wednesday – one day each.", "Jon trains Monday.", "Mia trains the day after Sara."], ["Monday", "Tuesday", "Wednesday"], 1, "Jon has Monday. Sara must have Tuesday and Mia Wednesday."], ["Who owns the red car?", ["Ali, Bea and Carl own a red, blue and white car – one each.", "Bea has the blue car.", "Carl does not have the white car."], ["Ali", "Bea", "Carl"], 2, "Bea has blue. Carl cannot have white, so Carl has red."], ["Which fruit did Emil choose?", ["Emil, Lisa and Jan chose apple, pear and banana – one each.", "Lisa chose pear.", "Jan did not choose banana."], ["Apple", "Pear", "Banana"], 2, "Lisa has pear. Jan must have apple, leaving banana for Emil."], ["Who is youngest?", ["Kari is older than Per.", "Per is older than Silje."], ["Kari", "Per", "Silje"], 2, "Silje is younger than Per, who is younger than Kari."], ["Who has the bicycle?", ["Ola, Pia and Jens have a bicycle, scooter and roller skates – one each.", "Pia has the roller skates.", "Jens does not have the bicycle."], ["Ola", "Pia", "Jens"], 0, "Pia has skates. Jens must have the scooter, leaving the bicycle for Ola."], ["Who stands furthest right?", ["Eva stands left of Lars.", "Lars stands left of Nina."], ["Eva", "Lars", "Nina"], 2, "The order is Eva, Lars, Nina."], ["What colour is Cup B?", ["Cups A, B and C are red,
