<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finn den ulike – Spillglede</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#edf6ff,#fff3cc 55%,#eee7ff);color:#17304f;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:18px}.back{display:inline-block;background:#17345d;color:#fff;text-decoration:none;padding:10px 16px;border-radius:13px;font-weight:900}h1{text-align:center;font-size:clamp(34px,6vw,56px);margin:12px 0 4px}.sub{text-align:center;font-weight:800}.panel{background:#fffdf7;border:4px solid #d9ae3d;border-radius:25px;padding:18px}.top{display:flex;justify-content:space-between;font-weight:900}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:680px;margin:22px auto}button.choice{aspect-ratio:1;border:3px solid #9eb5d0;border-radius:16px;background:#f2f7ff;cursor:pointer;position:relative;padding:12px}.lab{position:absolute;left:9px;top:7px;font-weight:900;font-size:20px}svg{width:100%;height:100%}line{stroke:#17304f;stroke-width:8;stroke-linecap:round}circle{fill:#17304f}.good{background:#bdf0c8!important;border-color:#39a55a!important}.bad{background:#ffd0d0!important;border-color:#d64b4b!important}.msg{min-height:60px;text-align:center;font-size:18px;font-weight:900}.ctrl{display:block;margin:10px auto;border:0;border-radius:13px;padding:11px 18px;background:#17345d;color:#fff;font-weight:900;font-size:17px;cursor:pointer}.setup{display:flex;justify-content:center;align-items:end;gap:12px;flex-wrap:wrap;margin:18px 0}
.setup label{display:block;font-weight:900;margin-bottom:5px}.setup select{padding:10px 14px;border:2px solid #17345d;border-radius:11px;font-size:17px;background:white}
.start{border:0;border-radius:13px;padding:11px 18px;background:#f1c84b;color:#2b2305;font-weight:900;font-size:17px;cursor:pointer}
.resumeBox{text-align:center;background:#eaf5ff;border:2px solid #9eb5d0;border-radius:15px;padding:14px;margin:10px auto 18px;max-width:600px}
.resumeBox button{margin:5px}
@media(max-width:550px){.choices{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><a class="back" href="hjernetrim.html">← Hjernetrim</a><h1>🔍 FINN DEN ULIKE</h1><p class="sub">60 varierte oppgaver – én figur bryter regelen</p><div class="panel" id="panel">
<div id="setup">
  <div id="resume"></div>
  <div class="setup">
    <div><label>Antall oppgaver</label><select id="amount"><option>10</option><option>20</option><option>30</option><option selected>50</option><option>60</option></select></div>
    <button class="start" onclick="startNew()">Start ny runde</button>
  </div>
</div>
<div id="game" style="display:none">
  <div class="top"><span id="prog"></span><span id="score"></span></div>
  <div id="choices" class="choices"></div>
  <div id="msg" class="msg">Hvilken av de seks figurene skiller seg ut?</div>
  <button id="next" class="ctrl" style="display:none" onclick="next()">Neste →</button>
</div></div></div>
<script>const BASE=[{"rule": "Fem figurer har én diagonal som går gjennom sentrum. Én gjør ikke det.", "figs": ["T R B L D1", "T R B L D2", "T R B L V D1", "T R B L H D2", "T R B L V H", "T R B L H D1"], "ans": 0, "arr": ["T R B L V H", "T R B L D1", "T R B L D2", "T R B L V D1", "T R B L H D2", "T R B L H D1"], "mode": "fig"}, {"rule": "Fem figurer har to streker som møtes i et hjørne. Én har to parallelle streker.", "figs": ["T L", "T R", "B L", "B R", "T B", "T L D1"], "ans": 1, "arr": ["T L", "T B", "T R", "B L", "B R", "T L D1"], "mode": "fig"}, {"rule": "Fem figurer har en prikk på en strek. Én har prikken uten berøring.", "custom": ["v-dot", "h-dot", "d1-dot", "d2-dot", "corner-dot", "free-dot"], "ans": 2, "arr": ["v-dot", "h-dot", "free-dot", "d1-dot", "d2-dot", "corner-dot"], "mode": "custom"}, {"rule": "Fem figurer kan roteres til samme form. Én er et speilbilde.", "figs": ["T L D1", "T R D2", "B R D1", "B L D2", "T R D1", "T L D1"], "ans": 3, "arr": ["T L D1", "T R D2", "B R D1", "T R D1", "B L D2", "T L D1"], "mode": "fig"}, {"rule": "Fem figurer har nøyaktig tre linjestykker. Én har fire.", "figs": ["T L V", "T R H", "B L D1", "B R D2", "T V D2", "L R V H"], "ans": 4, "arr": ["T L V", "T R H", "B L D1", "B R D2", "L R V H", "T V D2"], "mode": "fig"}, {"rule": "Fem figurer har en indre strek som berører to sider. Én indre strek berører ingen side.", "custom": ["v-full", "h-full", "d1-full", "d2-full", "v-full2", "short-center"], "ans": 0, "arr": ["short-center", "v-full", "h-full", "d1-full", "d2-full", "v-full2"], "mode": "custom"}, {"rule": "Fem figurer har symmetri langs minst én akse. Én mangler slik symmetri.", "figs": ["T B V", "L R H", "T B H", "L R V", "T R B L", "T R D1"], "ans": 1, "arr": ["T B V", "T R D1", "L R H", "T B H", "L R V", "T R B L"], "mode": "fig"}, {"rule": "Fem figurer består av en rammedel og én indre linje. Én har to indre linjer.", "figs": ["T L V", "T R H", "B L D1", "B R D2", "T B V", "L R V H"], "ans": 2, "arr": ["T L V", "T R H", "L R V H", "B L D1", "B R D2", "T B V"], "mode": "fig"}, {"rule": "Fem figurer har motsatte ytterkanter. Én har nabokanter.", "figs": ["T B V", "T B H", "L R V", "L R H", "T B D1", "T R D2"], "ans": 3, "arr": ["T B V", "T B H", "L R V", "T R D2", "L R H", "T B D1"], "mode": "fig"}, {"rule": "Fem figurer har samme antall endepunkter på ytterrammen. Én skiller seg ut.", "figs": ["V", "H", "D1", "D2", "T B", "T L"], "ans": 4, "arr": ["V", "H", "D1", "D2", "T L", "T B"], "mode": "fig"}, {"rule": "Fem figurer har sentrum markert av kryssende linjer. Én har linjer som ikke krysser i sentrum.", "figs": ["V H", "D1 D2", "V D1", "V D2", "H D1", "T B"], "ans": 0, "arr": ["T B", "V H", "D1 D2", "V D1", "V D2", "H D1"], "mode": "fig"}, {"rule": "Fem figurer følger regelen: ytterdel + diagonal. Én bruker bare rette midtlinjer.", "figs": ["T D1", "R D2", "B D1", "L D2", "T L D1", "V H"], "ans": 2, "arr": ["T D1", "R D2", "V H", "B D1", "L D2", "T L D1"], "mode": "fig"}];
const rotMap={T:'R',R:'B',B:'L',L:'T',V:'H',H:'V',D1:'D2',D2:'D1'};
const mirMap={T:'T',B:'B',L:'R',R:'L',V:'V',H:'H',D1:'D2',D2:'D1'};
function transCode(code,turns,mirror){
  if(!code || code.includes('-')) return code;
  let a=code.split(' ');
  if(mirror) a=a.map(x=>mirMap[x]||x);
  for(let n=0;n<turns;n++) a=a.map(x=>rotMap[x]||x);
  return a.join(' ');
}
function seeded(seed){let x=Math.sin(seed*999+17)*10000;return x-Math.floor(x)}
function permute(arr,seed){
  let a=arr.map((v,i)=>({v,i}));
  for(let j=a.length-1;j>0;j--){let k=Math.floor(seeded(seed+j)*(j+1));[a[j],a[k]]=[a[k],a[j]]}
  return a;
}
let Q=[];
for(let round=0;round<5;round++) BASE.forEach((q,qi)=>{
  let turns=(round+qi)%4, mirror=((round+qi*2)%3===0);
  let arr=q.arr.map(x=>q.mode==='fig'?transCode(x,turns,mirror):x);
  let pp=permute(arr,100+round*31+qi*7);
  let ans=pp.findIndex(o=>o.i===q.ans);
  Q.push({...q,arr:pp.map(o=>o.v),ans});
});
Q=Q.slice(0,60);;let i=0,pts=0,lock=false,game=[];
const SAVEKEY='spillglede_finn_den_ulike_v1';
const $=x=>document.getElementById(x);
const seg={T:[20,20,80,20],R:[80,20,80,80],B:[20,80,80,80],L:[20,20,20,80],V:[50,20,50,80],H:[20,50,80,50],D1:[20,20,80,80],D2:[80,20,20,80]};
function basic(c){let s='<svg viewBox="0 0 100 100">';c.split(' ').forEach(k=>{if(seg[k]){let a=seg[k];s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}"/>`}});return s+'</svg>'}
function custom(k){let line='';let dot='<circle cx="50" cy="50" r="6"/>';if(k==='v-dot'||k==='v-full'||k==='v-full2')line='<line x1="50" y1="15" x2="50" y2="85"/>';if(k==='h-dot'||k==='h-full')line='<line x1="15" y1="50" x2="85" y2="50"/>';if(k==='d1-dot'||k==='d1-full')line='<line x1="18" y1="18" x2="82" y2="82"/>';if(k==='d2-dot'||k==='d2-full')line='<line x1="82" y1="18" x2="18" y2="82"/>';if(k==='corner-dot'){line='<line x1="20" y1="20" x2="80" y2="80"/>';dot='<circle cx="35" cy="35" r="6"/>'}if(k==='free-dot'){line='<line x1="20" y1="20" x2="80" y2="20"/>';dot='<circle cx="50" cy="60" r="6"/>'}if(k==='short-center')line='<line x1="35" y1="50" x2="65" y2="50"/>';return '<svg viewBox="0 0 100 100">'+line+(k.includes('dot')?dot:'')+'</svg>'}
function shuffleIdx(n){let a=[...Array(n).keys()];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function save(){localStorage.setItem(SAVEKEY,JSON.stringify({ids:game.map(q=>Q.indexOf(q)),i,pts,total:game.length}))}
function clearSave(){localStorage.removeItem(SAVEKEY)}
function startNew(){let n=+$('amount').value;game=shuffleIdx(Q.length).slice(0,n).map(x=>Q[x]);i=0;pts=0;save();$('setup').style.display='none';$('game').style.display='block';show()}
function resumeGame(){let s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(!s)return;game=s.ids.map(x=>Q[x]).filter(Boolean);i=s.i;pts=s.pts;if(!game.length||i>=game.length){clearSave();location.reload();return}$('setup').style.display='none';$('game').style.display='block';show()}
function loadResume(){let s;try{s=JSON.parse(localStorage.getItem(SAVEKEY)||'null')}catch(e){s=null}if(s&&s.ids&&s.i<s.total){$('resume').innerHTML=`<div class="resumeBox"><b>Du har en lagret runde</b><br>Oppgave ${s.i+1} av ${s.total} · ${s.pts} poeng<br><button class="ctrl" onclick="resumeGame()">▶️ Fortsett</button><button class="ctrl" onclick="clearSave();location.reload()">🔄 Slett og start på nytt</button></div>`}}
function show(){lock=false;let q=game[i];$('prog').textContent=`Oppgave ${i+1} av ${game.length}`;$('score').textContent=`Poeng: ${pts}`;$('msg').textContent='Hvilken av de seks figurene skiller seg ut?';$('next').style.display='none';$('choices').innerHTML='';q.arr.forEach((x,k)=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="lab">${String.fromCharCode(65+k)}</span>`+(q.mode==='custom'?custom(x):basic(x));b.onclick=()=>answer(b,k);$('choices').appendChild(b)})}
function answer(b,k){if(lock)return;lock=true;let q=game[i];if(k===q.ans){pts++;b.classList.add('good');$('msg').textContent='✅ Riktig! '+q.rule}else{b.classList.add('bad');$('choices').children[q.ans].classList.add('good');$('msg').textContent='❌ '+q.rule}$('score').textContent=`Poeng: ${pts}`;save();$('next').style.display='block'}
function next(){i++;if(i<game.length){save();show()}else{clearSave();$('game').innerHTML=`<div style="text-align:center;padding:30px;font-size:22px;font-weight:900"><h2>🎉 Runde ferdig!</h2><p>${pts} av ${game.length} riktige</p><button class="ctrl" onclick="location.reload()">Ny runde</button></div>`}}
loadResume();</script></body></html>
