<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo – Spillglede</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#315b43,#101b16 60%,#080c0a)}
.wrap{max-width:1050px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.back{color:#fff;text-decoration:none;font-weight:800;background:#ffffff18;padding:10px 14px;border:1px solid #ffffff44;border-radius:12px}.logo{font-weight:900;font-size:25px;color:#ffd54a;text-shadow:2px 2px #6e2100}
.frame{background:linear-gradient(145deg,#713a1d,#3b1c0d);border:5px solid #cb8735;border-radius:26px;padding:17px;box-shadow:0 16px 50px #0008,inset 0 0 0 2px #f2c36e}
.game{background:#0d5638;border:3px solid #e4ad4b;border-radius:19px;padding:16px}h1{text-align:center;color:#ffdc55;font-size:44px;margin:0;text-shadow:3px 3px #7d2400}.sub{text-align:center;color:#f6e9c9;margin:5px 0 13px}
.layout{display:grid;grid-template-columns:minmax(300px,650px) 1fr;gap:18px;align-items:start}
.board{position:relative;aspect-ratio:1;background:#f8e9c4;border:5px solid #2a170c;border-radius:14px;overflow:hidden;box-shadow:0 10px 25px #0006}
.cell{position:absolute;width:6.67%;height:6.67%;border:1px solid #8b7659;background:#fff8e7}.path{background:#fff8e7}.safe{background:#f1d47b}
.home{position:absolute;width:40%;height:40%;border:3px solid #382313;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:9%}.home.red{left:0;top:0;background:#e74b3f}.home.green{right:0;top:0;background:#3eb65a}.home.yellow{right:0;bottom:0;background:#f0cf35}.home.blue{left:0;bottom:0;background:#368bd4}
.nest{width:56%;aspect-ratio:1;background:#fff9;border:2px solid #4c3926;border-radius:50%}.center{position:absolute;left:40%;top:40%;width:20%;height:20%;background:conic-gradient(#3eb65a 0 25%,#f0cf35 0 50%,#368bd4 0 75%,#e74b3f 0);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.token{position:absolute;width:5.2%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px #0008;z-index:10;transform:translate(-50%,-50%);cursor:pointer}.token.red{background:#c51e22}.token.green{background:#168b38}.token.yellow{background:#d6a900}.token.blue{background:#176ab1}.token.can{outline:4px solid #fff;animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.15)}}
.panel{background:#2b170c;border:2px solid #d59a43;border-radius:16px;padding:15px}.turn{font-size:20px;font-weight:900;text-align:center;margin-bottom:12px}.die{display:block;margin:10px auto;width:90px;height:90px;border:4px solid #e1bd75;border-radius:18px;background:#fff9e8;color:#111;font-size:55px;font-weight:900;box-shadow:0 7px 0 #8d642d;cursor:pointer}.die:disabled{opacity:.65}.info{text-align:center;min-height:58px;color:#ffe9ae;font-weight:700}.players{display:grid;gap:7px;margin:12px 0}.p{padding:9px;border-radius:10px;font-weight:800;border:2px solid transparent}.p.active{border-color:#fff}.p.red{background:#9e2727}.p.green{background:#16723a}.p.yellow{background:#947b11}.p.blue{background:#1b5d91}.new{width:100%;padding:11px;border-radius:12px;border:1px solid #f0c76d;background:#5d2c15;color:#fff;font-weight:900;cursor:pointer}
.setup{text-align:center;margin-bottom:12px}.setup select{font-size:16px;padding:8px;border-radius:9px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{max-width:650px;width:100%;margin:auto}.die{width:75px;height:75px;font-size:45px}h1{font-size:36px}.frame{padding:8px}.game{padding:9px}.logo{font-size:20px}}
</style></head>
<body><div class="wrap"><div class="top"><a class="back" href="index.html">← Spillglede</a><div class="logo">SPILLGLEDE 🎲</div></div>
<div class="frame"><div class="game"><h1>LUDO</h1><div class="sub">Få alle fire brikkene dine først i mål!</div>
<div class="setup">Antall spillere: <select id="count"><option value="2">2 spillere</option><option value="3">3 spillere</option><option value="4" selected>4 spillere</option></select></div>
<div class="layout"><div id="board" class="board">
<div class="home red"><i class="nest"></i><i class="nest"></i><i class="nest"></i><i class="nest"></i></div>
<div class="home green"><i class="nest"></i><i class="nest"></i><i class="nest"></i><i class="nest"></i></div>
<div class="home yellow"><i class="nest"></i><i class="nest"></i><i class="nest"></i><i class="nest"></i></div>
<div class="home blue"><i class="nest"></i><i class="nest"></i><i class="nest"></i><i class="nest"></i></div><div class="center"></div></div>
<div class="panel"><div id="turn" class="turn"></div><button id="die" class="die">🎲</button><div id="info" class="info">Trykk på terningen.</div><div id="players" class="players"></div><button id="new" class="new">↻ Nytt spill</button></div>
</div></div></div></div>
<script>
const colors=["red","green","yellow","blue"], names={red:"Rød",green:"Grønn",yellow:"Gul",blue:"Blå"};
const board=document.querySelector("#board"), dieBtn=document.querySelector("#die"), info=document.querySelector("#info");
let N=4, turn=0, roll=0, waiting=false, pieces={};
const path=[];
function addPath(){
 // 52-step rectangular/ring path represented around an inset square; visually clear and playable.
 const pts=[];
 for(let i=0;i<13;i++)pts.push([10+i*6.65,43.3]);
 for(let i=1;i<13;i++)pts.push([89.8,43.3+i*3.9]);
 for(let i=0;i<13;i++)pts.push([89.8-i*6.65,90]);
 for(let i=1;i<14;i++)pts.push([10,90-i*3.9]);
 return pts.slice(0,52);
}
path.push(...addPath());
const starts={red:0,green:13,yellow:26,blue:39};
const nests={red:[[13,13],[27,13],[13,27],[27,27]],green:[[73,13],[87,13],[73,27],[87,27]],yellow:[[73,73],[87,73],[73,87],[87,87]],blue:[[13,73],[27,73],[13,87],[27,87]]};
function drawTrack(){path.forEach((p,i)=>{let c=document.createElement("div");c.className="cell path"+([0,13,26,39].includes(i)?" safe":"");c.style.left=(p[0]-3.335)+"%";c.style.top=(p[1]-3.335)+"%";board.appendChild(c)})}
function posPiece(pc){
 let x,y;
 if(pc.step<0){[x,y]=nests[pc.color][pc.id]}
 else if(pc.step>=52){ // simple colored home lane toward centre
   let k=Math.min(pc.step-52,5), end=[50,50], start=path[(starts[pc.color]+51)%52];
   x=start[0]+(end[0]-start[0])*(k+1)/7;y=start[1]+(end[1]-start[1])*(k+1)/7;
 } else {[x,y]=path[(starts[pc.color]+pc.step)%52]}
 pc.el.style.left=x+"%";pc.el.style.top=y+"%";
}
function build(){
 document.querySelectorAll(".token").forEach(x=>x.remove());pieces={};
 colors.slice(0,N).forEach(c=>{pieces[c]=[];for(let i=0;i<4;i++){let el=document.createElement("button");el.className="token "+c;board.appendChild(el);let pc={color:c,id:i,step:-1,el};el.onclick=()=>move(pc);pieces[c].push(pc);posPiece(pc)}});render()
}
function current(){return colors[turn]}
function legal(pc){if(pc.color!==current())return false;if(pc.step<0)return roll===6;if(pc.step>=57)return false;return pc.step+roll<=57}
function render(){
 document.querySelector("#turn").textContent="Tur: "+names[current()];
 document.querySelector("#players").innerHTML=colors.slice(0,N).map((c,i)=>`<div class="p ${c} ${i===turn?"active":""}">${names[c]} spiller</div>`).join("");
 document.querySelectorAll(".token").forEach(x=>x.classList.remove("can"));
 if(waiting)pieces[current()].filter(legal).forEach(p=>p.el.classList.add("can"));
}
function throwDie(){
 if(waiting)return;roll=1+Math.floor(Math.random()*6);dieBtn.textContent=roll;let opts=pieces[current()].filter(legal);
 if(!opts.length){info.textContent=names[current()]+" fikk "+roll+" – ingen mulig flytting.";setTimeout(next,700)}
 else{waiting=true;info.textContent=names[current()]+" fikk "+roll+". Velg en markert brikke.";render()}
}
function move(pc){
 if(!waiting||!legal(pc))return;
 if(pc.step<0)pc.step=0;else pc.step+=roll;
 posPiece(pc);
 // capture only on common track, not start/safe squares
 if(pc.step>=0&&pc.step<52){
   let abs=(starts[pc.color]+pc.step)%52;
   if(![0,13,26,39].includes(abs))colors.slice(0,N).filter(c=>c!==pc.color).forEach(c=>pieces[c].forEach(o=>{
     if(o.step>=0&&o.step<52&&(starts[o.color]+o.step)%52===abs){o.step=-1;posPiece(o);info.textContent="💥 "+names[pc.color]+" slo ut "+names[o.color]+"!"}
   }))
 }
 waiting=false;
 if(pieces[pc.color].every(p=>p.step===57)){info.textContent="🏆 "+names[pc.color]+" vant spillet!";dieBtn.disabled=true;return}
 if(roll===6){info.textContent+=" Du fikk 6 og får kaste igjen!";roll=0;dieBtn.textContent="🎲";render()}
 else next()
}
function next(){waiting=false;roll=0;turn=(turn+1)%N;dieBtn.textContent="🎲";info.textContent="Trykk på terningen.";render()}
function reset(){N=+document.querySelector("#count").value;turn=0;roll=0;waiting=false;dieBtn.disabled=false;dieBtn.textContent="🎲";info.textContent="Trykk på terningen.";build()}
drawTrack();dieBtn.onclick=throwDie;document.querySelector("#new").onclick=()=>{if(confirm("Starte et nytt Ludo-spill?"))reset()};document.querySelector("#count").onchange=reset;reset();
</script></body></html>
