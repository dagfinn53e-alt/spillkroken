const KEY='spillglede_hoderegning_v1', USED='spillglede_hoderegning_used_v1';
const $=id=>document.getElementById(id);
let state=null,locked=false,advanceTimer=null;
function shuffle(items){let a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){if(state)localStorage.setItem(KEY,JSON.stringify(state))}
function show(which){['setup','game','done'].forEach(id=>$(id).classList.toggle('hide',id!==which))}
function start(){clearTimeout(advanceTimer);let level=$('level').value,n=+$('count').value,pool=shuffle(QUESTIONS.map((q,i)=>({...q,id:i})).filter(q=>level==='Blandet'||q.level===level));let used=[];try{used=JSON.parse(localStorage.getItem(USED)||'[]')}catch(e){};let fresh=pool.filter(q=>!used.includes(q.id));let picked=fresh.slice(0,n);if(picked.length<n)picked.push(...pool.filter(q=>!picked.includes(q)).slice(0,n-picked.length));state={ids:picked.map(q=>q.id),index:0,score:0,paused:false};save();show('game');render()}
function render(){clearTimeout(advanceTimer);if(!state)return;if(state.index>=state.ids.length){finish();return}locked=false;show('game');$('paused').classList.add('hide');$('questionArea').classList.remove('hide');let q=QUESTIONS[state.ids[state.index]];$('progress').textContent=`Oppgave ${state.index+1} av ${state.ids.length}`;$('score').textContent=`Poeng: ${state.score}`;$('question').textContent=q.q;$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('feedback').textContent='';$('feedback').className='feedback';$('answer').focus()}
function check(){if(locked||!state)return;let v=$('answer').value.trim();if(v===''){$('feedback').textContent='Skriv et svar først.';return}locked=true;let q=QUESTIONS[state.ids[state.index]],correct=Number(v)===q.a;if(correct)state.score++;let used=[];try{used=JSON.parse(localStorage.getItem(USED)||'[]')}catch(e){};if(!used.includes(state.ids[state.index]))used.push(state.ids[state.index]);localStorage.setItem(USED,JSON.stringify(used));state.index++;save();$('answer').disabled=true;$('check').disabled=true;$('score').textContent=`Poeng: ${state.score}`;$('feedback').textContent=correct?'✅ Riktig!':`❌ Riktig svar er ${q.a}.`;$('feedback').className='feedback '+(correct?'ok':'bad');advanceTimer=setTimeout(render,1900)}
function pause(){clearTimeout(advanceTimer);if(!state)return;state.paused=true;save();$('questionArea').classList.add('hide');$('paused').classList.remove('hide')}
function unpause(){if(!state)return;state.paused=false;save();render()}
function finish(){let points=state.score,total=state.ids.length;localStorage.removeItem(KEY);state=null;show('done');$('result').textContent=`Du fikk ${points} av ${total} riktige!`}
function restore(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.ids)&&Number.isInteger(x.index)&&x.index>=0&&x.index<=x.ids.length&&x.ids.every(i=>Number.isInteger(i)&&i>=0&&i<QUESTIONS.length)){state=x;return true}}catch(e){}return false}
$('start').onclick=start;$('check').onclick=check;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('pause').onclick=pause;$('unpause').onclick=unpause;$('toMenu').onclick=()=>{show('setup');$('resume').classList.remove('hide')};$('again').onclick=()=>{show('setup');$('resume').classList.add('hide')};$('continue').onclick=()=>{if(!state)restore();if(state){show('game');render()}};$('discard').onclick=()=>{state=null;localStorage.removeItem(KEY);$('resume').classList.add('hide')};if(restore())$('resume').classList.remove('hide');document.addEventListener('visibilitychange',()=>{if(document.hidden&&state&&!state.paused)pause()});
