<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ballongfest og Vennefest – Barnas Spillglede</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:linear-gradient(145deg,#5a4bad,#2c8dc5 55%,#58d0c4);min-height:100vh;color:#243254}.shell{max-width:1080px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:white}.top h1{font-size:clamp(26px,5vw,45px);margin:6px 0}.back{background:#ffffff30;color:white;border:2px solid #ffffff77;padding:10px 14px;border-radius:18px;text-decoration:none;font-weight:800}.stats{background:#fff8;padding:9px 15px;border-radius:20px;font-weight:900}.stage{position:relative;overflow:hidden;min-height:590px;background:linear-gradient(#80d5ff 0%,#c9f2ff 67%,#92d77b 68%,#4bad70);border:7px solid #f6f2ff;border-radius:30px;box-shadow:0 18px 0 #243d8a66,0 20px 35px #0003;margin-top:12px}.sun{position:absolute;right:7%;top:10%;width:75px;height:75px;background:#ffdf71;border-radius:50%;box-shadow:0 0 0 13px #ffeaa455}.cloud{position:absolute;font-size:65px;opacity:.7;pointer-events:none}.cloud.one{top:12%;left:8%}.cloud.two{top:29%;right:9%}.banner{position:relative;z-index:3;text-align:center;margin:15px auto 0;max-width:780px;padding:12px 20px;background:#fffef1;border:5px solid #ffda69;border-radius:25px;box-shadow:0 8px 0 #dcad5c;font-size:clamp(20px,3.4vw,31px);font-weight:900}.sub{position:relative;z-index:3;text-align:center;font-weight:800;margin:12px auto;font-size:17px;background:#ffffffba;border-radius:20px;width:max-content;max-width:94%;padding:7px 16px}.field{position:relative;z-index:2;min-height:340px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:center;justify-items:center;padding:12px 15px 25px}.balloon{position:relative;width:clamp(62px,13vw,112px);height:clamp(82px,17vw,145px);border:0;background:none;cursor:pointer;touch-action:manipulation;animation:float 3s ease-in-out infinite;transition:transform .2s;filter:drop-shadow(0 6px 4px #2454a955)}.balloon:focus-visible{outline:4px solid #2839b8;border-radius:40px}.balloon:active{transform:scale(.9)}.oval{position:absolute;top:0;left:8%;width:84%;height:78%;border-radius:52% 52% 48% 48%;background:radial-gradient(ellipse at 29% 25%,#fff9,transparent 26%),var(--balloon);border:2px solid #ffffff66;box-shadow:inset -12px -10px 16px #0002}.knot{position:absolute;top:76%;left:43%;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:13px solid var(--balloon)}.string{position:absolute;top:86%;left:50%;height:15%;width:2px;background:#5a7f9b}.number{position:absolute;top:21%;left:0;width:100%;text-align:center;color:#fff;font-weight:1000;font-size:clamp(23px,5vw,45px);text-shadow:0 3px 5px #0007}.popped{animation:pop .3s forwards!important;pointer-events:none}.bottom{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}.btn{border:0;border-radius:20px;padding:15px 22px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #26407877}.primary{background:#ffdb62}.secondary{background:#fff}.progress{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px auto}.dot{width:20px;height:20px;border-radius:50%;background:#ffffff66;border:2px solid #fff}.dot.done{background:#ffe66c}.feedback{position:absolute;z-index:10;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(32px,6vw,60px);font-weight:1000;color:#fff;text-shadow:0 5px 4px #30578d,0 0 20px #345;pointer-events:none;text-align:center;animation:appear .7s}.confetti{position:absolute;z-index:9;pointer-events:none;font-size:30px;animation:scatter 1.1s ease-out forwards}.finish{position:absolute;inset:12%;z-index:12;background:#fff8dc;border:6px solid #ffd45a;border-radius:35px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:20px}.finish h2{font-size:clamp(29px,5vw,48px);margin:0}.finish p{font-size:21px;margin:0}.hidden{display:none}@keyframes float{50%{translate:0 -13px}}@keyframes pop{to{transform:scale(1.7);opacity:0}}@keyframes appear{from{opacity:0;scale:.7}to{opacity:1;scale:1}}@keyframes scatter{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}@media(max-width:600px){.shell{padding:8px}.stage{min-height:565px;border-width:4px}.field{grid-template-columns:repeat(3,1fr);min-height:380px;padding:5px;gap:0}.balloon{width:76px;height:100px}.banner{margin:10px;font-size:21px;padding:10px}.top h1{font-size:26px}.number{font-size:30px}}@media(prefers-reduced-motion:reduce){.balloon{animation:none}}

.field{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;justify-items:center;gap:14px;padding:22px;min-height:365px;position:relative;z-index:3}.item{width:100%;max-width:160px;min-height:118px;border:4px solid #fff;border-radius:24px;background:linear-gradient(145deg,#fff,#d8f1ff);box-shadow:0 8px 0 #437fb477;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:pointer;animation:appear .35s ease-out;touch-action:manipulation}.item .pic{font-size:clamp(46px,6vw,76px);line-height:1.2}.item .word{font-size:18px;font-weight:900;color:#344466}.item:active{transform:scale(.94)}.item.popped{opacity:.12;pointer-events:none;transform:scale(.7);transition:.35s}.item.wrong{animation:shake .35s}.hintGlow{box-shadow:0 0 0 7px #fff39a,0 0 25px #ffe86a!important}.tag{display:inline-block;padding:5px 12px;border-radius:15px;background:#ffffffba;font-weight:900;margin:5px}.bottom{flex-wrap:wrap}.small{font-size:14px;font-weight:700;color:#fff;text-align:center;margin-top:10px}.finish{background:#fff8dc}.hidden{display:none!important}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@media(max-width:600px){.field{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;min-height:390px}.item{min-height:99px;border-width:3px}.item .pic{font-size:47px}.item .word{font-size:14px}.stage{min-height:585px}}

/* Vennefest: ny helhetlig spillscene */
body{background:radial-gradient(circle at 15% 12%,#fff4a94a,transparent 28%),radial-gradient(circle at 90% 35%,#f3a3d94a,transparent 30%),linear-gradient(145deg,#543a9e,#2b74b6 55%,#25aaac);font-family:system-ui,"Segoe UI",sans-serif}
.shell{max-width:1120px;padding:18px 16px 30px}
.top{background:#241c5b66;padding:14px 20px;border:2px solid #ffffff55;border-radius:28px;box-shadow:0 12px 30px #1b175333}
.top h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.8px;text-shadow:0 3px 2px #33216e}
.back{display:inline-flex;align-items:center;background:#ffffffed;color:#403180;border:0;box-shadow:0 4px 0 #ffffff55}
.stats{background:#fff6dc;color:#594180;border:3px solid white;box-shadow:0 5px 0 #c4a35b;font-size:20px}
.stage{background:linear-gradient(180deg,#67bbf9 0%,#b9ecff 56%,#b4dc89 56.5%,#6bc575 80%,#36a66e);border:8px solid #fff5ce;border-radius:38px;min-height:650px;box-shadow:0 14px 0 #e6bb79,0 28px 45px #142d674d;isolation:isolate}
.stage:before{content:"";position:absolute;z-index:0;inset:0;background:radial-gradient(ellipse at 50% 100%,#e3e99c 0 10%,transparent 48%);pointer-events:none}
.stage:after{content:"🌼    🌷      🌸      🌻       🌼       🌸";position:absolute;bottom:7px;left:0;right:0;z-index:0;text-align:center;font-size:27px;letter-spacing:13px;opacity:.8;pointer-events:none}
.sun{right:6%;top:6%;width:90px;height:90px;background:radial-gradient(circle at 30% 30%,#fff6b4,#ffd44d);box-shadow:0 0 0 13px #ffe78e77,0 0 0 25px #fff4a844}
.cloud{opacity:.85;filter:drop-shadow(0 4px 3px #5896c955)}
.banner{margin:24px auto 0;background:linear-gradient(165deg,#fffefb,#fff2cf);border:5px solid #fff;outline:4px solid #ffc64c;box-shadow:0 9px 0 #e8a64c,0 14px 18px #4069a733;color:#50377c;border-radius:26px;max-width:740px;padding:17px 25px;font-size:clamp(23px,3.5vw,36px)}
.sub{background:#ffffffed;color:#574078;border:2px solid #ffffff;font-size:18px;box-shadow:0 4px 12px #44769b33;margin-top:18px}
.field{min-height:400px;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:780px;margin:10px auto 20px;padding:20px 22px 35px}
.item{max-width:210px;min-height:132px;border:5px solid #fff;border-radius:28px;background:linear-gradient(145deg,#fffefa,#d5f1ff);box-shadow:0 8px 0 #3979ad,0 13px 15px #316ea23a;transition:transform .16s,box-shadow .16s;position:relative}
.item:before{content:"";position:absolute;inset:6px;border:2px solid #9cdaf8;border-radius:18px;pointer-events:none}
.item:hover{transform:translateY(-4px);box-shadow:0 12px 0 #3979ad,0 18px 20px #316ea23a}
.item:focus-visible,.btn:focus-visible{outline:5px solid #ffcc33;outline-offset:3px}
.item .pic{font-size:clamp(53px,7vw,82px);filter:drop-shadow(0 5px 3px #183e6340)}
.item .word{font-size:19px;color:#36547b}
.item.popped{transform:scale(.65);opacity:.05}
.bottom{margin-top:30px;gap:15px}.btn{border:3px solid white;border-radius:19px;padding:15px 22px;box-shadow:0 6px 0 #1a347a77;font-size:18px;transition:transform .15s}.btn:hover{transform:translateY(-2px)}
.primary{background:linear-gradient(#ffe785,#ffbf53)}.secondary{background:linear-gradient(#fff,#e1f2ff);color:#3e4a82}
.progress{margin:20px auto}.dot{width:25px;height:25px;background:#ffffff88}.dot.done{background:#ffe16c;box-shadow:0 0 12px #ffe782}
.small{background:#251e6277;padding:12px;border-radius:18px;max-width:720px;margin:12px auto}
.friend{position:absolute;z-index:2;bottom:14px;font-size:clamp(45px,7vw,85px);pointer-events:none;filter:drop-shadow(0 8px 5px #28614777);animation:friendBob 3.5s ease-in-out infinite}.friend.left{left:2%}.friend.right{right:2%;animation-delay:-1.5s}
.bunting{position:absolute;left:0;right:0;top:0;text-align:center;z-index:1;font-size:27px;letter-spacing:12px;opacity:.9;pointer-events:none}
.theme-tag{position:relative;z-index:4;text-align:center;margin:12px auto 0;width:max-content;max-width:90%;background:#6b54c7;color:#fff;border:2px solid #fff;border-radius:20px;padding:7px 18px;font-weight:900;box-shadow:0 4px 0 #392a80}
@keyframes friendBob{50%{transform:translateY(-12px) rotate(3deg)}}
@media(max-width:600px){.shell{padding:8px}.top{padding:12px}.top h1{font-size:25px}.stage{border-width:5px;min-height:640px;border-radius:27px}.banner{margin:24px 14px 0;padding:13px;font-size:23px}.field{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:15px 9px 28px;min-height:390px}.item{min-height:105px;border-width:3px;border-radius:18px}.item:before{inset:3px;border-radius:12px}.item .pic{font-size:clamp(38px,10vw,55px)}.item .word{font-size:13px}.friend{font-size:42px;bottom:8px}.friend.left{left:1%}.friend.right{right:1%}.bunting{font-size:18px;letter-spacing:5px}.bottom{gap:8px}.btn{font-size:15px;padding:13px 10px}.sub{font-size:15px}}
@media(prefers-reduced-motion:reduce){.friend{animation:none}.item{transition:none}}
</style></head><body><main class="shell"><header class="top"><div><a class="back" href="barnas-spillglede.html">← Barnas Spillglede</a><h1>🎈 Ballongfest og Vennefest!</h1></div><div class="stats">⭐ <span id="stars">0</span> &nbsp; 🎯 <span id="round">1</span>/60</div></header><section class="stage" id="stage"><div class="sun"></div><div class="bunting" aria-hidden="true">🎈 ✨ 🎏 ✨ 🎈</div><div class="friend left" aria-hidden="true">🦊</div><div class="friend right" aria-hidden="true">🐻</div><div class="cloud one">☁️</div><div class="cloud two">☁️</div><div class="banner" id="question">Velkommen!</div><div class="theme-tag" id="themeTag">🌈 Velkommen til Vennefest!</div><div class="sub" id="subtitle">Se nøye og finn riktig svar!</div><div class="field" id="field"></div><div id="feedback" aria-live="polite"></div><div class="finish hidden" id="finish"><div style="font-size:75px">🏆🐻🌈</div><h2>Hurra! Alle oppgavene er løst!</h2><p>Du er en ekte kunnskapsmester!</p><button class="btn primary" id="again">🌟 Spill igjen</button></div></section><div class="bottom"><button class="btn secondary" id="hint">💡 Hint</button><button class="btn secondary" id="repeat">🔊 Les opp</button><button class="btn secondary" id="restart">↻ Start på nytt</button></div><div class="progress" id="progress"></div><div class="small">Spillet går automatisk videre når du har svart riktig. Ingen tidsfrist.</div></main><script>
const $=id=>document.getElementById(id);
const groups={dyr:[['🐶','hund'],['🐱','katt'],['🐰','kanin'],['🐻','bjørn'],['🦊','rev'],['🐸','frosk'],['🐼','panda'],['🐵','ape'],['🐷','gris'],['🐮','ku'],['🐔','høne'],['🐘','elefant']],frukt:[['🍎','eple'],['🍌','banan'],['🍓','jordbær'],['🍇','druer'],['🍐','pære'],['🍊','appelsin'],['🍉','vannmelon'],['🍒','kirsebær']],kjoretoy:[['🚗','bil'],['🚌','buss'],['🚜','traktor'],['🚲','sykkel'],['🚂','tog'],['🚁','helikopter'],['🚀','rakett'],['🚒','brannbil']],natur:[['🌻','solsikke'],['🌹','rose'],['🌷','tulipan'],['🌳','tre'],['🌈','regnbue'],['☀️','sol'],['⭐','stjerne'],['🌙','måne']],former:[['🔴','sirkel'],['🟦','firkant'],['🔺','trekant'],['💛','hjerte'],['⭐','stjerne'],['🟢','grønn sirkel'],['🟨','gul firkant'],['🔷','rombe']]};
const colors=[['🔴','rød'],['🔵','blå'],['🟡','gul'],['🟢','grønn'],['🟣','lilla'],['🟠','oransje']];
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
let tasks=[],index=0,stars=0,found=0,locked=false,advanceTimer=null,voiceEnabled=false;
function buildTasks(){let t=[];let entries=Object.entries(groups);for(let round=0;round<6;round++){for(const [name,items] of entries){let target=items[(round*3+entries.findIndex(x=>x[0]===name))%items.length];t.push({kind:'find',group:name,target,question:'Kan du finne '+(name==='dyr'?'dyret ':name==='kjoretoy'?'kjøretøyet ':name==='natur'?'tingen ':name==='former'?'formen ':'frukten ')+target[1]+'?',hint:'Se etter '+target[0]+' '+target[1]+'.'});let count=2+round%4;let symbol=items[(round+2)%items.length];t.push({kind:'count',group:name,target:symbol,count,question:'Finn '+count+' '+symbol[1]+'!',hint:'Trykk på '+symbol[0]+' til du har funnet '+count+'.'});}}
for(let i=0;i<12;i++){let target=colors[i%colors.length];t.splice(i*5+2,0,{kind:'color',group:'colors',target,question:'Finn fargen '+target[1]+'!',hint:'Se etter '+target[0]+'.'})}
return t.slice(0,60)}
function speak(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='nb-NO';u.rate=.83;let v=speechSynthesis.getVoices().find(x=>/^(nb|no)/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function start(){clearTimeout(advanceTimer);tasks=buildTasks();index=0;stars=0;$('stars').textContent='0';$('finish').classList.add('hidden');show()}
function show(){if(index>=tasks.length){$('finish').classList.remove('hidden');$('field').innerHTML='';$('question').textContent='Du klarte alle 60 oppgavene!';$('subtitle').textContent='Fantastisk innsats!';return}locked=false;found=0;let t=tasks[index];$('round').textContent=index+1;$('question').textContent=t.question;$('subtitle').textContent='Trykk på riktig bilde!';$('themeTag').textContent=({dyr:'🐻 Dyrevennene',frukt:'🍎 Frukthagen',kjoretoy:'🚗 Kjøretøyparken',natur:'🌼 Naturparken',former:'🔷 Formlandet',colors:'🎨 Fargelandet'})[t.group]||'🎈 Vennefest';$('feedback').innerHTML='';$('progress').innerHTML='';let goal=t.kind==='count'?t.count:1;for(let i=0;i<goal;i++){let d=document.createElement('span');d.className='dot';$('progress').append(d)}let pool=t.kind==='color'?colors:groups[t.group];let targets=Array.from({length:goal},()=>t.target);let others=shuffle(pool.filter(x=>x[1]!==t.target[1]));let vals=shuffle([...targets,...others.slice(0,Math.max(0,9-goal))]);while(vals.length<9)vals.push(others[vals.length%others.length]);$('field').innerHTML='';vals.forEach((v,i)=>{let b=document.createElement('button');b.className='item';b.setAttribute('aria-label',v[1]);b.innerHTML='<span class="pic">'+v[0]+'</span><span class="word">'+v[1]+'</span>';b.onclick=()=>pick(b,v[1]===t.target[1],goal);$('field').append(b)})}
function burst(){let st=$('stage');for(let i=0;i<14;i++){let el=document.createElement('span');el.className='confetti';el.textContent=['⭐','✨','🎉','🌟'][i%4];el.style.left=(20+Math.random()*60)+'%';el.style.top=(25+Math.random()*50)+'%';el.style.setProperty('--dx',(Math.random()*420-210)+'px');el.style.setProperty('--dy',(Math.random()*280-140)+'px');st.append(el);setTimeout(()=>el.remove(),1150)}}
function pick(b,correct,goal){if(locked||b.classList.contains('popped'))return;if(!correct){$('subtitle').textContent='Prøv igjen! Du klarer det! 💛';b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');return}b.classList.add('popped');found++;$('progress').children[found-1]?.classList.add('done');$('subtitle').textContent='Så flink! '+found+' av '+goal+' 🌟';if(found>=goal){locked=true;stars++;$('stars').textContent=stars;burst();$('subtitle').textContent='Hurra! Riktig! Neste oppgave kommer snart …';let f=document.createElement('div');f.className='feedback';f.textContent='🌟 Kjempebra! 🌟';$('feedback').append(f);advanceTimer=setTimeout(()=>{index++;show()},1600)}}
$('hint').onclick=()=>{if(locked)return;let t=tasks[index];$('subtitle').textContent=t.hint;let b=[...$('field').children].find(x=>!x.classList.contains('popped')&&x.getAttribute('aria-label')===t.target[1]);if(b){b.classList.add('hintGlow');setTimeout(()=>b.classList.remove('hintGlow'),1100)}};
$('repeat').onclick=()=>speak(tasks[index]?.question||'Du er kjempeflink!');$('restart').onclick=start;$('again').onclick=start;start();
</script></body></html>
