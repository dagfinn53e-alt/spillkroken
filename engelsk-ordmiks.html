<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engelsk Ordmiks</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf6ff,#fff5d8);color:#17345b}
.wrap{max-width:820px;margin:auto;padding:18px;text-align:center}h1{font-size:clamp(30px,6vw,48px);margin:10px 0 3px}.sub{font-weight:700;color:#52677f}
.panel,.card{background:#fff;border:4px solid #244f83;border-radius:25px;padding:22px;margin:22px auto;box-shadow:0 10px 28px #17345b22}
.row{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:12px 18px;background:#1769d2;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
button.sel{background:#d99400}.mix{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:8px;color:#9a5a00;margin:20px 0}
input{width:min(380px,92%);font-size:24px;text-align:center;padding:13px;border:3px solid #9eb5cf;border-radius:14px;text-transform:uppercase}
#feedback{min-height:58px;font-size:21px;font-weight:900;margin-top:12px}.good{color:#14833b}.bad{color:#b3261e}
.score,.nor{font-size:20px;font-weight:900}.nor{font-size:25px;margin-top:15px}.back{color:#17345b;font-weight:800;text-decoration:none}
.hide{display:none}.note{font-size:14px;color:#60758c;margin-top:10px}
</style></head><body><div class="wrap"><a class="back" href="ordmiks.html">← Tilbake til Ordmiks</a>
<h1>🇬🇧 Engelsk Ordmiks</h1><div class="sub">Lær engelske ord mens du spiller</div>
<div id="setup" class="panel"><h2>Velg nivå</h2><div class="row" id="levels">
<button data-l="Lett" class="sel">😊 Lett</button><button data-l="Middels">🙂 Middels</button><button data-l="Vanskelig">🧠 Vanskelig</button><button data-l="Blandet">🎲 Blandet</button></div>
<h2>Antall ord</h2><div class="row" id="counts"><button data-n="10" class="sel">10</button><button data-n="20">20</button><button data-n="30">30</button></div>
<button id="start" style="margin-top:20px;font-size:19px">▶ Start spillet</button>
<div class="note">90 ord totalt – 30 på hvert nivå.</div></div>
<div id="game" class="card hide"><div class="score">Oppgave <span id="num"></span>/<span id="total"></span> · Poeng: <span id="score">0</span></div>
<div class="nor">Hva heter <span id="nor"></span> på engelsk?</div><div class="mix" id="mix"></div>
<input id="ans" autocomplete="off" placeholder="Skriv engelsk ord"><br><button id="check">✅ Sjekk svar</button><div id="feedback"></div></div>
</div><script>
const bank=[{"en": "CAT", "no": "KATT", "level": "Lett"}, {"en": "DOG", "no": "HUND", "level": "Lett"}, {"en": "HOUSE", "no": "HUS", "level": "Lett"}, {"en": "BOOK", "no": "BOK", "level": "Lett"}, {"en": "RED", "no": "RØD", "level": "Lett"}, {"en": "BLUE", "no": "BLÅ", "level": "Lett"}, {"en": "GREEN", "no": "GRØNN", "level": "Lett"}, {"en": "MILK", "no": "MELK", "level": "Lett"}, {"en": "WATER", "no": "VANN", "level": "Lett"}, {"en": "APPLE", "no": "EPLE", "level": "Lett"}, {"en": "CAR", "no": "BIL", "level": "Lett"}, {"en": "SUN", "no": "SOL", "level": "Lett"}, {"en": "MOON", "no": "MÅNE", "level": "Lett"}, {"en": "TREE", "no": "TRE", "level": "Lett"}, {"en": "FISH", "no": "FISK", "level": "Lett"}, {"en": "BIRD", "no": "FUGL", "level": "Lett"}, {"en": "HAND", "no": "HÅND", "level": "Lett"}, {"en": "FOOT", "no": "FOT", "level": "Lett"}, {"en": "DOOR", "no": "DØR", "level": "Lett"}, {"en": "CHAIR", "no": "STOL", "level": "Lett"}, {"en": "TABLE", "no": "BORD", "level": "Lett"}, {"en": "BED", "no": "SENG", "level": "Lett"}, {"en": "BALL", "no": "BALL", "level": "Lett"}, {"en": "FOOD", "no": "MAT", "level": "Lett"}, {"en": "DAY", "no": "DAG", "level": "Lett"}, {"en": "NIGHT", "no": "NATT", "level": "Lett"}, {"en": "BOY", "no": "GUTT", "level": "Lett"}, {"en": "GIRL", "no": "JENTE", "level": "Lett"}, {"en": "MOTHER", "no": "MOR", "level": "Lett"}, {"en": "FATHER", "no": "FAR", "level": "Lett"}, {"en": "SCHOOL", "no": "SKOLE", "level": "Middels"}, {"en": "WINDOW", "no": "VINDU", "level": "Middels"}, {"en": "FAMILY", "no": "FAMILIE", "level": "Middels"}, {"en": "ANIMAL", "no": "DYR", "level": "Middels"}, {"en": "FRIEND", "no": "VENN", "level": "Middels"}, {"en": "SUMMER", "no": "SOMMER", "level": "Middels"}, {"en": "WINTER", "no": "VINTER", "level": "Middels"}, {"en": "MORNING", "no": "MORGEN", "level": "Middels"}, {"en": "KITCHEN", "no": "KJØKKEN", "level": "Middels"}, {"en": "GARDEN", "no": "HAGE", "level": "Middels"}, {"en": "TEACHER", "no": "LÆRER", "level": "Middels"}, {"en": "STUDENT", "no": "ELEV", "level": "Middels"}, {"en": "DINNER", "no": "MIDDAG", "level": "Middels"}, {"en": "BREAKFAST", "no": "FROKOST", "level": "Middels"}, {"en": "COUNTRY", "no": "LAND", "level": "Middels"}, {"en": "CITY", "no": "BY", "level": "Middels"}, {"en": "STREET", "no": "GATE", "level": "Middels"}, {"en": "BICYCLE", "no": "SYKKEL", "level": "Middels"}, {"en": "AIRPLANE", "no": "FLY", "level": "Middels"}, {"en": "HOLIDAY", "no": "FERIE", "level": "Middels"}, {"en": "WEATHER", "no": "VÆR", "level": "Middels"}, {"en": "RAIN", "no": "REGN", "level": "Middels"}, {"en": "SNOW", "no": "SNØ", "level": "Middels"}, {"en": "CLOUD", "no": "SKY", "level": "Middels"}, {"en": "BEACH", "no": "STRAND", "level": "Middels"}, {"en": "FOREST", "no": "SKOG", "level": "Middels"}, {"en": "RIVER", "no": "ELV", "level": "Middels"}, {"en": "MOUNTAIN", "no": "FJELL", "level": "Middels"}, {"en": "QUESTION", "no": "SPØRSMÅL", "level": "Middels"}, {"en": "ANSWER", "no": "SVAR", "level": "Middels"}, {"en": "BEAUTIFUL", "no": "VAKKER", "level": "Vanskelig"}, {"en": "DIFFERENT", "no": "FORSKJELLIG", "level": "Vanskelig"}, {"en": "IMPORTANT", "no": "VIKTIG", "level": "Vanskelig"}, {"en": "LANGUAGE", "no": "SPRÅK", "level": "Vanskelig"}, {"en": "KNOWLEDGE", "no": "KUNNSKAP", "level": "Vanskelig"}, {"en": "ADVENTURE", "no": "EVENTYR", "level": "Vanskelig"}, {"en": "EXERCISE", "no": "ØVELSE", "level": "Vanskelig"}, {"en": "REMEMBER", "no": "HUSKE", "level": "Vanskelig"}, {"en": "UNDERSTAND", "no": "FORSTÅ", "level": "Vanskelig"}, {"en": "TOGETHER", "no": "SAMMEN", "level": "Vanskelig"}, {"en": "FAVOURITE", "no": "FAVORITT", "level": "Vanskelig"}, {"en": "DIFFICULT", "no": "VANSKELIG", "level": "Vanskelig"}, {"en": "INTERESTING", "no": "INTERESSANT", "level": "Vanskelig"}, {"en": "CHILDREN", "no": "BARN", "level": "Vanskelig"}, {"en": "EVERYTHING", "no": "ALT", "level": "Vanskelig"}, {"en": "SOMETHING", "no": "NOE", "level": "Vanskelig"}, {"en": "YESTERDAY", "no": "I GÅR", "level": "Vanskelig"}, {"en": "TOMORROW", "no": "I MORGEN", "level": "Vanskelig"}, {"en": "AFTERNOON", "no": "ETTERMIDDAG", "level": "Vanskelig"}, {"en": "NEIGHBOUR", "no": "NABO", "level": "Vanskelig"}, {"en": "HOSPITAL", "no": "SYKEHUS", "level": "Vanskelig"}, {"en": "LIBRARY", "no": "BIBLIOTEK", "level": "Vanskelig"}, {"en": "RESTAURANT", "no": "RESTAURANT", "level": "Vanskelig"}, {"en": "COMPUTER", "no": "DATAMASKIN", "level": "Vanskelig"}, {"en": "TELEPHONE", "no": "TELEFON", "level": "Vanskelig"}, {"en": "CHOCOLATE", "no": "SJOKOLADE", "level": "Vanskelig"}, {"en": "VEGETABLE", "no": "GRØNNSAK", "level": "Vanskelig"}, {"en": "BUTTERFLY", "no": "SOMMERFUGL", "level": "Vanskelig"}, {"en": "BIRTHDAY", "no": "BURSDAG", "level": "Vanskelig"}, {"en": "HOMEWORK", "no": "LEKSER", "level": "Vanskelig"}];let level='Lett',count=10,game=[],i=0,score=0,locked=false;
document.querySelectorAll('#levels button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#levels button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');level=b.dataset.l});
document.querySelectorAll('#counts button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#counts button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');count=+b.dataset.n});
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function scramble(w){let s=w;for(let k=0;k<30&&s===w;k++)s=shuffle(w.split('')).join('');return s}
start.onclick=()=>{let pool=level==='Blandet'?bank:bank.filter(x=>x.level===level);game=shuffle(pool).slice(0,Math.min(count,pool.length));i=score=0;setup.classList.add('hide');document.getElementById('game').classList.remove('hide');show()};
function show(){locked=false;let q=game[i];num.textContent=i+1;total.textContent=game.length;document.getElementById('score').textContent=score;nor.textContent=q.no;mix.textContent=scramble(q.en).split('').join(' ');ans.value='';feedback.textContent='';feedback.className='';ans.focus()}
function checkAnswer(){if(locked)return;let q=game[i],v=ans.value.trim().toUpperCase();if(!v)return;locked=true;
if(v===q.en){score++;feedback.className='good';feedback.textContent=`✅ ${q.en} = ${q.no}`;}
else{feedback.className='bad';feedback.textContent=`❌ Riktig svar: ${q.en} = ${q.no}`;}
document.getElementById('score').textContent=score;setTimeout(()=>{i++;if(i<game.length)show();else finish()},1400)}
function finish(){document.getElementById('game').innerHTML=`<h2>🎉 Ferdig!</h2><p style="font-size:25px;font-weight:900">Du fikk ${score} av ${game.length} riktige.</p><button onclick="location.reload()">🔄 Spill igjen</button>`}
check.onclick=checkAnswer;ans.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});
</script></body></html>
