<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logiske oppgaver – Spillglede</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eef7ff,#fff2c9 55%,#eee7ff);color:#17304f;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:18px}.back{display:inline-block;background:#17345d;color:white;text-decoration:none;padding:10px 16px;border-radius:13px;font-weight:900}h1{text-align:center;font-size:clamp(35px,6vw,57px);margin:12px 0 4px}.sub{text-align:center;font-weight:800}.panel{background:#fffdf7;border:4px solid #d9ae3d;border-radius:25px;padding:22px;box-shadow:0 10px 28px #17304f22}.top{display:flex;justify-content:space-between;font-weight:900}.question{font-size:23px;font-weight:900;line-height:1.4;text-align:center;margin:28px auto;max-width:720px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:17px;border:3px solid #9eb5d0;border-radius:15px;background:#f2f7ff;font-size:18px;font-weight:900;cursor:pointer}.good{background:#bdf0c8!important;border-color:#39a55a!important}.bad{background:#ffd0d0!important;border-color:#d64b4b!important}.msg{text-align:center;min-height:72px;font-size:18px;font-weight:900;margin:15px}.ctrl{display:block;margin:10px auto;border:0;border-radius:13px;padding:11px 18px;background:#17345d;color:white;font-size:17px;font-weight:900;cursor:pointer}.setup{display:flex;justify-content:center;align-items:end;gap:12px;flex-wrap:wrap;margin:18px 0}
.setup label{display:block;font-weight:900;margin-bottom:5px}.setup select{padding:10px 14px;border:2px solid #17345d;border-radius:11px;font-size:17px;background:white}
.start{border:0;border-radius:13px;padding:11px 18px;background:#f1c84b;color:#2b2305;font-weight:900;font-size:17px;cursor:pointer}
.resumeBox{text-align:center;background:#eaf5ff;border:2px solid #9eb5d0;border-radius:15px;padding:14px;margin:10px auto 18px;max-width:600px}.resumeBox button{margin:5px}
@media(max-width:600px){.answers{grid-template-columns:1fr}.question{font-size:20px}}</style></head><body><div class="wrap"><a class="back" href="hjernetrim.html">← Hjernetrim</a><h1>⚖️ LOGISKE OPPGAVER</h1><p class="sub">30 varierte logiske nøtter – velg hvor mange du vil ta</p><div class="panel" id="panel">
<div id="setup"><div id="resume"></div><div class="setup">
<div><label>Antall oppgaver</label><select id="amount"><option>10</option><option>20</option><option selected>30</option></select></div>
<button class="start" onclick="startNew()">Start ny runde</button></div></div>
<div id="game" style="display:none"><div class="top"><span id="prog"></span><span id="score"></span></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="msg" class="msg"></div><button id="next" class="ctrl" style="display:none" onclick="next()">Neste →</button></div></div></div>
<script>const BANK=[{"q": "Tre venner har hund, katt og fisk. Nina har fisk. Mona har ikke hund. Lars har ikke katt. Hvilket dyr har Mona?", "o": ["Hund", "Katt", "Fisk", "Kan ikke avgjøres"], "a": 1, "e": "Nina har fisk. Mona kan ikke ha hund, så Mona må ha katt."}, {"q": "Kari er eldre enn Per. Per er eldre enn Liv. Ola er yngre enn Kari, men eldre enn Per. Hvem er nest eldst?", "o": ["Kari", "Per", "Liv", "Ola"], "a": 3, "e": "Rekkefølgen er Kari, Ola, Per, Liv."}, {"q": "Hans står foran Eva. Eva står foran Finn. Finn står foran Gerd. Hvem står som nummer tre?", "o": ["Hans", "Eva", "Finn", "Gerd"], "a": 2, "e": "Rekkefølgen er Hans, Eva, Finn, Gerd."}, {"q": "Alle røde kort er store. Ingen store kort er runde. Hva må være sant om et rødt kort?", "o": ["Det er rundt", "Det er ikke rundt", "Det er lite", "Det er blått"], "a": 1, "e": "Rødt betyr stort, og store kort er aldri runde."}, {"q": "En kode har tre sifre. Første siffer er dobbelt så stort som det siste. Midtsifferet er 3. Summen er 9. Hva er koden?", "o": ["432", "633", "333", "234"], "a": 0, "e": "4 + 3 + 2 = 9, og 4 er dobbelt så stort som 2."}, {"q": "Du passerer personen på andreplass i et løp. Hvilken plass har du nå?", "o": ["Første", "Andre", "Tredje", "Fjerde"], "a": 1, "e": "Du overtar andreplassen."}, {"q": "En bonde har 17 sauer. Alle unntatt 9 løper bort. Hvor mange er igjen?", "o": ["8", "9", "17", "26"], "a": 1, "e": "Alle unntatt 9 betyr at 9 blir igjen."}, {"q": "En klokke slår 6 slag på 5 sekunder. Hvor lang tid tar 12 slag?", "o": ["10 sekunder", "11 sekunder", "12 sekunder", "15 sekunder"], "a": 1, "e": "6 slag har 5 mellomrom. 12 slag har 11 mellomrom."}, {"q": "Fire kort ligger på bordet: A, D, 4 og 7. Regel: Har kortet vokal på én side, skal det ha partall på den andre. Hvilke må snus?", "o": ["A og 4", "A og 7", "D og 4", "Bare A"], "a": 1, "e": "A må sjekkes for partall, og 7 må sjekkes for at det ikke skjuler en vokal."}, {"q": "Tre bokser er merket Epler, Pærer og Blandet. Alle etikettene er feil. Hvilken boks bør du trekke én frukt fra først?", "o": ["Epler", "Pærer", "Blandet", "Valgfri"], "a": 2, "e": "Boksen merket Blandet kan ikke være blandet, så én frukt derfra gir nøkkelen."}, {"q": "Anne sier: «Bjørn lyver.» Bjørn sier: «Cato lyver.» Cato sier: «Anne og Bjørn lyver begge.» Bare én snakker sant. Hvem?", "o": ["Anne", "Bjørn", "Cato", "Ingen"], "a": 1, "e": "Hvis Bjørn snakker sant, lyver Cato. Anne lyver også fordi Bjørn da ikke lyver."}, {"q": "En skuff har røde og blå sokker. Hvor mange må du minst ta i mørket for å være sikker på å få to med samme farge?", "o": ["2", "3", "4", "5"], "a": 1, "e": "Med to farger vil den tredje sokken garantert matche én av de to første."}, {"q": "Du har 8 like kuler. Én er tyngre. Med en balansevekt, hvor mange veiinger trenger du minst for å finne den?", "o": ["1", "2", "3", "4"], "a": 1, "e": "Vei 3 mot 3. Deretter kan én ny veiing avgjøre hvilken kule som er tyngst."}, {"q": "Et rom har tre brytere utenfor og én lyspære inne. Du kan gå inn bare én gang. Hva kan hjelpe deg å finne riktig bryter?", "o": ["Pærens varme", "Bryterens lyd", "Ledningens farge", "Dørens retning"], "a": 0, "e": "En pære som nylig var tent kan være varm selv om den er slukket."}, {"q": "To fedre og to sønner går på tur, men de er bare tre personer. Hvordan?", "o": ["To er tvillinger", "Bestefar, far og sønn", "Én person teller dobbelt", "Det er umulig"], "a": 1, "e": "Bestefaren er far, faren er både sønn og far, og barnet er sønn."}, {"q": "I en pose er 4 røde, 4 blå og 4 grønne kuler. Hvor mange må du ta uten å se for å være sikker på minst én av hver farge?", "o": ["3", "7", "9", "10"], "a": 2, "e": "I verste fall kan du trekke alle 8 fra to farger først. Den niende må være den tredje fargen."}, {"q": "Et tall er større enn 20, mindre enn 30, oddetall og delelig med 3. Hvilket?", "o": ["21", "24", "27", "29"], "a": 2, "e": "27 er oddetall, mellom 20 og 30, og delelig med 3."}, {"q": "Mona bor høyere enn Liv. Liv bor høyere enn Per. Hvem kan ikke bo nederst?", "o": ["Mona", "Liv", "Per", "Både Mona og Liv"], "a": 3, "e": "Både Mona og Liv har noen under seg og kan derfor ikke bo nederst."}, {"q": "Hvis i går var to dager før fredag, hvilken dag er det i dag?", "o": ["Onsdag", "Torsdag", "Fredag", "Lørdag"], "a": 1, "e": "To dager før fredag er onsdag. Hvis det var i går, er i dag torsdag."}, {"q": "En familie har fire døtre. Hver datter har én bror. Hvor mange barn har familien minst?", "o": ["5", "8", "4", "6"], "a": 0, "e": "Alle fire døtrene kan ha den samme broren: totalt fem barn."}, {"q": "En flaske og kork koster 110 kr til sammen. Flasken koster 100 kr mer enn korken. Hva koster korken?", "o": ["5 kr", "10 kr", "15 kr", "20 kr"], "a": 0, "e": "Kork 5 kr og flaske 105 kr gir 110 kr og en forskjell på 100 kr."}, {"q": "Du har én fyrstikk og kommer inn i et mørkt rom med stearinlys, peis og oljelampe. Hva tenner du først?", "o": ["Stearinlyset", "Peisen", "Oljelampen", "Fyrstikken"], "a": 3, "e": "Du må tenne fyrstikken først."}, {"q": "En lege gir deg tre tabletter og sier: ta én hver halvtime. Hvor lang tid tar det før alle tre er tatt?", "o": ["30 min", "60 min", "90 min", "120 min"], "a": 1, "e": "Første tas med én gang, neste etter 30 min og siste etter 60 min."}, {"q": "Fem maskiner lager fem deler på fem minutter. Hvor lang tid bruker 100 maskiner på 100 deler?", "o": ["5 min", "20 min", "100 min", "500 min"], "a": 0, "e": "Hver maskin lager én del på fem minutter."}, {"q": "En mann ser på et bilde og sier: «Jeg har ingen søsken, men faren til denne mannen er min fars sønn.» Hvem er på bildet?", "o": ["Faren hans", "Sønnen hans", "Han selv", "Bestefaren"], "a": 1, "e": "Min fars sønn er mannen selv. Han er altså far til personen på bildet."}, {"q": "Du har to tau som hver brenner opp på 60 minutter, men ujevnt. Hvordan måler du 45 minutter?", "o": ["Tenn ett tau i én ende", "Tenn begge i én ende", "Tenn tau 1 i begge ender og tau 2 i én; tenn andre enden av tau 2 når tau 1 er borte", "Umulig"], "a": 2, "e": "Tau 1 bruker 30 min når det tennes i begge ender. Resten av tau 2 bruker da 15 min."}, {"q": "Tre dører: bak én er premie. Du vet at dør 1 ikke har premien. Dør 2 og 3 er de eneste mulighetene. Hvor stor er sjansen for dør 2 uten mer informasjon?", "o": ["25 %", "33 %", "50 %", "75 %"], "a": 2, "e": "Når bare to muligheter gjenstår og ingen annen informasjon finnes, er de like sannsynlige."}, {"q": "En bok og en penn koster 84 kr. Boken koster tre ganger så mye som pennen. Hva koster pennen?", "o": ["18 kr", "21 kr", "24 kr", "28 kr"], "a": 1, "e": "Fire like deler er 84 kr. Én del er 21 kr."}, {"q": "Fire bøker står i en hylle. Den blå står til venstre for den røde. Den grønne står til høyre for den røde. Den gule står til venstre for den blå. Hvilken står lengst til høyre?", "o": ["Gul", "Blå", "Rød", "Grønn"], "a": 3, "e": "Rekkefølgen blir gul, blå, rød, grønn."}, {"q": "En buss har 10 passasjerer. På første stopp går 3 av og 5 på. På neste går 4 av og 2 på. Hvor mange passasjerer er da på bussen?", "o": ["8", "9", "10", "11"], "a": 2, "e": "10 − 3 + 5 − 4 + 2 = 10."}];let game=[],i=0,pts=0,lock=false;
const SAVEKEY='spillglede_logiske_oppgaver_v1';const $=x=>document.getElementById(x);
function indexes(){let a=[...Array(BANK.length).keys()];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function save(){localStorage.setItem(SAVEKEY,JSON.stringify({ids:game.map(q=>BANK.indexOf(q)),i,pts,total:game.length}))}
function clearSave(){localStorage.removeItem(SAVEKEY)}
function startNew(){let n=+$('amount').value;game=indexes().slice(0,n).map(x=>BANK[x]);i=0;pts=0;save();$('setup').style.display='none';$('game').style.display='block';show()}
function resumeGame(){let s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(!s)return;game=s.ids.map(x=>BANK[x]).filter(Boolean);i=s.i;pts=s.pts;if(!game.length||i>=game.length){clearSave();location.reload();return}$('setup').style.display='none';$('game').style.display='block';show()}
function loadResume(){let s;try{s=JSON.parse(localStorage.getItem(SAVEKEY)||'null')}catch(e){s=null}if(s&&s.ids&&s.i<s.total){$('resume').innerHTML=`<div class="resumeBox"><b>Du har en lagret runde</b><br>Oppgave ${s.i+1} av ${s.total} · ${s.pts} poeng<br><button class="ctrl" onclick="resumeGame()">▶️ Fortsett</button><button class="ctrl" onclick="clearSave();location.reload()">🔄 Slett og start på nytt</button></div>`}}
function show(){lock=false;let q=game[i];$('prog').textContent=`Oppgave ${i+1} av ${game.length}`;$('score').textContent=`Poeng: ${pts}`;$('q').textContent=q.q;$('answers').innerHTML='';q.o.forEach((x,k)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+k)+'  '+x;b.onclick=()=>answer(b,k);$('answers').appendChild(b)});$('msg').textContent='';$('next').style.display='none'}
function answer(b,k){if(lock)return;lock=true;let q=game[i];if(k===q.a){pts++;b.classList.add('good');$('msg').textContent='✅ Riktig! '+q.e}else{b.classList.add('bad');$('answers').children[q.a].classList.add('good');$('msg').textContent='❌ '+q.e}$('score').textContent=`Poeng: ${pts}`;save();$('next').style.display='block'}
function next(){i++;if(i<game.length){save();show()}else{clearSave();$('game').innerHTML=`<div style="text-align:center;padding:30px;font-size:22px;font-weight:900"><h2>🎉 Runde ferdig!</h2><p>${pts} av ${game.length} riktige</p><button class="ctrl" onclick="location.reload()">Ny runde</button></div>`}}
loadResume();</script></body></html>
