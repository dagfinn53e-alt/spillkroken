function show(){if(i>=list.length)return finish();locked=false;let x=list[i],opts=x[1].map((v,j)=>({v,correct:j===x[2]}));if(opts.length>2)shuffle(opts);$("prog").textContent=`${level} • Spørsmål ${i+1} av ${list.length}`;$("q").textContent=x[0];$("answers").innerHTML="";$("fb").textContent="";opts.forEach(o=>{let b=document.createElement("button");b.className="ans";b.textContent=o.v;b.onclick=()=>answer(b,o,x[1][x[2]]);$("answers").appendChild(b)});playerbar()}
function answer(btn,o,right){if(locked)return;locked=true;document.querySelectorAll(".ans").forEach(b=>b.disabled=true);if(o.correct){btn.classList.add("correct");score[turn]++;$("fb").textContent="✅ Riktig svar!"}else{btn.classList.add("wrong");[...document.querySelectorAll(".ans")].find(b=>b.textContent===right)?.classList.add("correct");$("fb").textContent="🟡 Feil. Det riktige svaret er markert med grønt."}playerbar();setTimeout(()=>{turn=(turn+1)%n;i++;show()},1800)}
function finish(){let max=Math.max(...score),w=score.map((s,j)=>s===max?j+1:null).filter(Boolean);$("res").textContent=n===1?`⛷️ Du fikk ${score[0]} av ${list.length} poeng!`:w.length>1?`🤝 Uavgjort! ${max} poeng.`:`🏆 Spiller ${w[0]} vant med ${max} poeng!`;$("over").classList.add("show")}
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{level=b.dataset.l;document.querySelectorAll(".level").forEach(x=>x.classList.toggle("active",x===b));start()});
$("new").onclick=start;$("np").onchange=start;$("nc").onchange=start;$("again").onclick=start;start();
</script></body></html>
