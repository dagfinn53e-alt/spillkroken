const SAVEKEY='spillglede_tallrekker_v1';const $=x=>document.getElementById(x);
function shuffledIndexes(){let a=[...Array(BANK.length).keys()];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function save(){localStorage.setItem(SAVEKEY,JSON.stringify({ids:game.map(q=>BANK.indexOf(q)),i,pts,total:game.length}))}
function clearSave(){localStorage.removeItem(SAVEKEY)}
function startNew(){let n=+$('amount').value;game=shuffledIndexes().slice(0,n).map(x=>BANK[x]);i=0;pts=0;save();$('setup').style.display='none';$('game').style.display='block';show()}
function resumeGame(){let s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(!s)return;game=s.ids.map(x=>BANK[x]).filter(Boolean);i=s.i;pts=s.pts;if(!game.length||i>=game.length){clearSave();location.reload();return}$('setup').style.display='none';$('game').style.display='block';show()}
function loadResume(){let s;try{s=JSON.parse(localStorage.getItem(SAVEKEY)||'null')}catch(e){s=null}if(s&&s.ids&&s.i<s.total){$('resume').innerHTML=`<div class="resumeBox"><b>Du har en lagret runde</b><br>Oppgave ${s.i+1} av ${s.total} · ${s.pts} poeng<br><button class="ctrl" onclick="resumeGame()">▶️ Fortsett</button><button class="ctrl" onclick="clearSave();location.reload()">🔄 Slett og start på nytt</button></div>`}}

function answer(b,k){if(lock)return;lock=true;let q=game[i];if(k===q.correct){pts++;b.classList.add('good');$('msg').textContent='✅ Riktig! '+q.rule}else{b.classList.add('bad');$('answers').children[q.correct].classList.add('good');$('msg').textContent='❌ '+q.rule}$('score').textContent=`Poeng: ${pts}`;save();$('next').style.display='block'}
