<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yatzy – Spillglede</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#75431f,#29140b 72%);color:#fff;min-height:100vh}
header{text-align:center;padding:12px}h1{margin:0;color:#ffd85b;font-size:clamp(42px,7vw,70px);text-shadow:0 4px #54240b}.btn{border:3px solid #63300e;border-radius:25px;padding:9px 16px;background:linear-gradient(#ffe477,#e7aa31);color:#351a0b;font-weight:900;cursor:pointer;text-decoration:none}
.controls,.players,.dice{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:10px}.pbtn.active{background:linear-gradient(#52d668,#138b32);color:white}.turn{text-align:center;color:#ffe56c;font-size:23px;font-weight:900;margin:8px}
.die{width:82px;height:82px;border-radius:16px;border:5px solid #7b3c13;background:linear-gradient(#fff,#fff3c9);color:#111;font-size:52px;font-weight:1000;cursor:pointer;box-shadow:0 7px #5b2b10;text-shadow:none;display:flex;align-items:center;justify-content:center}.die.held{background:#8be399;border-color:#ffe25b;transform:translateY(-7px)}
.roll{display:block;margin:12px auto;background:linear-gradient(#36c454,#087b25);color:white;border-color:#ffe25b;font-size:20px}.info{text-align:center;font-weight:900}
.sheet{max-width:1000px;margin:15px auto 30px;padding:0 8px;overflow-x:auto}table{border-collapse:separate;border-spacing:2px;width:100%;min-width:620px;background:#4b260f;border:4px solid #d6a33b;border-radius:14px}
th,td{padding:8px;text-align:center;background:#fff4cf;color:#35190b;font-weight:900}th{background:#d99c32}.cat{text-align:left}.score{cursor:pointer}.score.available{background:#d7f8dc;box-shadow:inset 0 0 0 2px #58b96a}.score.used{background:#eee;color:#555}.currentHead{background:#45c45d!important;color:white!important}.sum td{background:#ffe082}.total td{background:#f1bd43;font-size:18px}
#win{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10}#win.show{display:flex}.winbox{background:linear-gradient(#fff0a6,#dfa02f);color:#32170b;border:6px solid #6b310d;border-radius:25px;padding:28px;text-align:center;max-width:520px}.winbox h2{font-size:40px;margin:0 0 10px}
@media(max-width:600px){.die{width:64px;height:64px;font-size:42px}.turn{font-size:19px}}</style></head><body>
<header><h1>🎲 YATZY</h1><div class="players"><span>Antall spillere:</span><button class="btn pbtn" onclick="setPlayers(1,this)">1</button><button class="btn pbtn" onclick="setPlayers(2,this)">2</button><button class="btn pbtn" onclick="setPlayers(3,this)">3</button><button class="btn pbtn active" onclick="setPlayers(4,this)">4</button></div>
<div class="controls"><button class="btn" onclick="newGame()">🔄 Nytt spill</button><a class="btn" href="index.html">🏠 Spillglede</a></div></header>
<div class="turn" id="turn">Spiller 1 sin tur</div><div class="dice" id="dice"></div><button class="btn roll" id="roll" onclick="rollDice()">🎲 KAST TERNINGENE</button><div class="info" id="info">Kast 1 av 3</div>
<div class="sheet"><table id="sheet"></table></div>
<div id="win"><div class="winbox"><h2>🏆 Spillet er ferdig!</h2><div id="result"></div><button class="btn" onclick="newGame()">🎲 Spill igjen</button> <a class="btn" href="index.html">🏠 Spillglede</a></div></div>
<script>
const cats=['Enere','Toere','Treere','Firere','Femmere','Seksere','Ett par','To par','Tre like','Fire like','Liten straight','Stor straight','Hus','Sjanse','Yatzy'];
let nPlayers=4,player=0,d=[1,1,1,1,1],held=[0,0,0,0,0],rolls=0,scores=[];
function fresh(){return Array.from({length:nPlayers},()=>Array(15).fill(null))}
function setPlayers(n,e){nPlayers=n;document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('active'));e.classList.add('active');newGame()}
function newGame(){player=0;rolls=0;held=[0,0,0,0,0];d=[1,1,1,1,1];scores=fresh();win.classList.remove('show');renderDice();renderSheet();update()}
function renderDice(){dice.innerHTML='';d.forEach((v,i)=>{let b=document.createElement('button');b.className='die'+(held[i]?' held':'');b.textContent=v;b.onclick=()=>{if(rolls){held[i]=!held[i];renderDice()}};dice.appendChild(b)})}
function rollDice(){if(rolls>=3)return;for(let i=0;i<5;i++)if(!held[i])d[i]=1+Math.floor(Math.random()*6);rolls++;renderDice();renderSheet();update()}
function calc(k){let c=[0,0,0,0,0,0,0];d.forEach(x=>c[x]++);let sum=d.reduce((a,b)=>a+b,0);
if(k<6)return c[k+1]*(k+1);if(k===6){for(let x=6;x>=1;x--)if(c[x]>=2)return x*2;return 0}
if(k===7){let p=[];for(let x=6;x>=1;x--)if(c[x]>=2)p.push(x);return p.length>=2?(p[0]+p[1])*2:0}
if(k===8){for(let x=6;x>=1;x--)if(c[x]>=3)return x*3;return 0}if(k===9){for(let x=6;x>=1;x--)if(c[x]>=4)return x*4;return 0}
if(k===10)return [1,2,3,4,5].every(x=>c[x]===1)?15:0;if(k===11)return [2,3,4,5,6].every(x=>c[x]===1)?20:0
if(k===12){let a=false,b=false;for(let x=1;x<=6;x++){if(c[x]===2)a=true;if(c[x]===3)b=true}return a&&b?sum:0}
if(k===13)return sum;if(k===14)return c.some(x=>x===5)?50:0}
function upper(p){return scores[p].slice(0,6).reduce((a,b)=>a+(b??0),0)}function bonus(p){return upper(p)>=63?50:0}function total(p){return scores[p].reduce((a,b)=>a+(b??0),0)+bonus(p)}
function choose(k){if(!rolls||scores[player][k]!==null)return;scores[player][k]=calc(k);nextTurn()}
function nextTurn(){let done=scores.every(s=>s.every(x=>x!==null));if(done){finish();return}do{player=(player+1)%nPlayers}while(scores[player].every(x=>x!==null));rolls=0;held=[0,0,0,0,0];d=[1,1,1,1,1];renderDice();renderSheet();update()}
function renderSheet(){let h='<tr><th>Kategori</th>';for(let p=0;p<nPlayers;p++)h+='<th class="'+(p===player?'currentHead':'')+'">Spiller '+(p+1)+'</th>';h+='</tr>';
cats.forEach((c,k)=>{h+='<tr><td class="cat">'+c+'</td>';for(let p=0;p<nPlayers;p++){let v=scores[p][k];let av=p===player&&v===null&&rolls;h+='<td class="score '+(v!==null?'used':av?'available':'')+'" '+(p===player?'onclick="choose('+k+')"':'')+'>'+(v!==null?v:'')+'</td>'}h+='</tr>'});
h+='<tr class="sum"><td class="cat">ØVRE SUM / 63</td>';for(let p=0;p<nPlayers;p++)h+='<td>'+upper(p)+' / 63</td>';h+='</tr><tr class="sum"><td class="cat">BONUS</td>';for(let p=0;p<nPlayers;p++)h+='<td>'+bonus(p)+'</td>';h+='</tr><tr class="total"><td class="cat">TOTALT</td>';for(let p=0;p<nPlayers;p++)h+='<td>'+total(p)+'</td>';h+='</tr>';sheet.innerHTML=h}
function update(){turn.textContent='🎯 Spiller '+(player+1)+' sin tur';info.textContent=rolls===0?'Klar for første kast':'Kast '+rolls+' av 3 – klikk terninger du vil holde';roll.disabled=rolls>=3}
function finish(){renderSheet();let vals=Array.from({length:nPlayers},(_,p)=>({p:p+1,s:total(p)})).sort((a,b)=>b.s-a.s);let best=vals[0].s,w=vals.filter(x=>x.s===best);result.innerHTML='<h3>'+(w.length>1?'🤝 Uavgjort!':'🥇 Spiller '+w[0].p+' vinner!')+'</h3>'+vals.map(x=>'Spiller '+x.p+': <b>'+x.s+' poeng</b>').join('<br>');win.classList.add('show')}
newGame();
</script></body></html>
