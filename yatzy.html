<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yatzy – Spillglede</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#254f37,#101c17 55%,#090d0b)}
.wrap{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}
.logo{font-size:28px;font-weight:900;color:#ffd54a;text-shadow:2px 2px #7b1d00}.back{color:#fff;text-decoration:none;font-weight:800;background:#ffffff18;padding:11px 15px;border:1px solid #ffffff40;border-radius:12px}
.board{background:linear-gradient(145deg,#6b3519,#3c1d0e);border:5px solid #c8832f;border-radius:28px;padding:22px;box-shadow:0 15px 50px #0008,inset 0 0 0 2px #f0bd62}
.inner{background:linear-gradient(#0f613d,#073c28);border:3px solid #e3ad4e;border-radius:20px;padding:22px}
h1{text-align:center;color:#ffd94f;font-size:46px;margin:0;text-shadow:3px 3px #7b1c00}.sub{text-align:center;color:#f5e8c7;margin:5px 0 20px}
.dice{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0}.die{width:96px;height:96px;border:4px solid #e4c587;border-radius:19px;background:#fff9e9;color:#171717;font-size:56px;font-weight:900;cursor:pointer;box-shadow:0 7px 0 #9d713a,0 10px 18px #0007}.die.held{border-color:#ffcf27;background:#fff0a8;transform:translateY(-7px);box-shadow:0 7px 0 #a16c00,0 13px 20px #0008}
.controls{text-align:center}.roll{border:3px solid #ffd35b;background:linear-gradient(#29a942,#087c25);color:#fff;font-size:20px;font-weight:900;padding:15px 32px;border-radius:30px;cursor:pointer;box-shadow:0 5px 0 #075b1d}.roll:disabled{filter:grayscale(1);opacity:.6}.msg{text-align:center;min-height:26px;margin:15px;color:#fff4cd;font-weight:700}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score button{display:flex;justify-content:space-between;border:2px solid #a77835;background:#fff8df;color:#33220f;border-radius:11px;padding:11px 13px;font-weight:800;cursor:pointer}.score button:hover:not(:disabled){background:#ffe9a1}.score button:disabled{cursor:default;background:#ded5ba;color:#514b3d}
.total{margin-top:18px;padding:15px;border-radius:13px;background:#241207;border:2px solid #c98b36;font-size:25px;font-weight:900;text-align:center;color:#ffd94f}.new{display:block;margin:15px auto 0;border:1px solid #e6c077;background:#5d2c15;color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;cursor:pointer}
@media(max-width:600px){.wrap{padding:9px}.board{padding:10px;border-width:3px}.inner{padding:12px}.die{width:59px;height:59px;font-size:34px;border-radius:13px}.score{grid-template-columns:1fr}h1{font-size:37px}.logo{font-size:22px}}
</style></head>
<body><div class="wrap">
<div class="top"><a class="back" href="index.html">← Spillglede</a><div class="logo">SPILLGLEDE 🎲</div></div>
<div class="board"><div class="inner"><h1>YATZY</h1><div class="sub">Kast · hold · velg poeng · maks 3 kast</div>
<div id="dice" class="dice"></div><div class="controls"><button id="roll" class="roll">KAST TERNINGENE</button></div><div id="msg" class="msg">Trykk på knappen for å starte.</div>
<div id="score" class="score"></div>
<div class="total" style="font-size:18px;line-height:1.8">
  ØVRE SUM: <span id="upper">0</span> / 63<br>
  BONUS: <span id="bonus">0</span> POENG
</div>
<div class="total">TOTAL: <span id="total">0</span> POENG</div><button id="new" class="new">↻ Nytt spill</button>
</div></div></div>
<script>
const C=[["Enere","n1"],["Toere","n2"],["Treere","n3"],["Firere","n4"],["Femmere","n5"],["Seksere","n6"],["Ett par","pair"],["To par","two"],["Tre like","three"],["Fire like","four"],["Liten straight","small"],["Stor straight","large"],["Hus","house"],["Sjanse","chance"],["Yatzy","yatzy"]];
let d=[1,1,1,1,1],h=[0,0,0,0,0],r=0,s={};
const D=document.querySelector("#dice"),S=document.querySelector("#score"),R=document.querySelector("#roll"),M=document.querySelector("#msg");
function cnt(){let c={};d.forEach(x=>c[x]=(c[x]||0)+1);return c}
function val(k){let c=cnt(),v=Object.keys(c).map(Number),sum=d.reduce((a,b)=>a+b,0);
 if(/^n[1-6]$/.test(k)){let n=+k[1];return(c[n]||0)*n}
 if(k==="pair"){let a=v.filter(x=>c[x]>=2);return a.length?Math.max(...a)*2:0}
 if(k==="two"){let a=v.filter(x=>c[x]>=2).sort((a,b)=>b-a);return a.length>1?a[0]*2+a[1]*2:0}
 if(k==="three"){let a=v.filter(x=>c[x]>=3);return a.length?Math.max(...a)*3:0}
 if(k==="four"){let a=v.filter(x=>c[x]>=4);return a.length?Math.max(...a)*4:0}
 if(k==="small")return[1,2,3,4,5].every(x=>c[x]===1)?15:0;
 if(k==="large")return[2,3,4,5,6].every(x=>c[x]===1)?20:0;
 if(k==="house"){let a=Object.values(c).sort();return JSON.stringify(a)==="[2,3]"?sum:0}
 if(k==="chance")return sum;if(k==="yatzy")return v.some(x=>c[x]===5)?50:0;return 0}
function dice(){D.innerHTML="";d.forEach((x,i)=>{let b=document.createElement("button");b.className="die"+(h[i]?" held":"");b.textContent=x;b.onclick=()=>{if(!r)return;h[i]=!h[i];dice()};D.appendChild(b)})}
function score(){S.innerHTML="";C.forEach(([n,k])=>{let b=document.createElement("button"),done=k in s;b.disabled=done||!r;b.innerHTML="<span>"+n+"</span><strong>"+(done?s[k]:(r?val(k):"–"))+"</strong>";b.onclick=()=>pick(k);S.appendChild(b)});let upper=["n1","n2","n3","n4","n5","n6"].reduce((a,k)=>a+(s[k]||0),0);
let bonus=upper>=63?50:0;
document.querySelector("#upper").textContent=upper;
document.querySelector("#bonus").textContent=bonus;
document.querySelector("#total").textContent=Object.values(s).reduce((a,b)=>a+b,0)+bonus}
function roll(){if(r>=3)return;d=d.map((x,i)=>h[i]?x:Math.ceil(Math.random()*6));r++;M.textContent="Kast "+r+" av 3 – trykk på terninger du vil holde, eller velg poeng.";R.textContent=r<3?"KAST IGJEN":"VELG POENG";R.disabled=r>=3;dice();score()}
function pick(k){s[k]=val(k);r=0;h=[0,0,0,0,0];R.disabled=false;R.textContent="KAST TERNINGENE";M.textContent=Object.keys(s).length===C.length?"🏆 Spillet er ferdig!":"Poeng lagret – klar for neste runde.";dice();score()}
function reset(){d=[1,1,1,1,1];h=[0,0,0,0,0];r=0;s={};R.disabled=false;R.textContent="KAST TERNINGENE";M.textContent="Trykk på knappen for å starte.";dice();score()}
R.onclick=roll;document.querySelector("#new").onclick=()=>{if(confirm("Vil du starte et nytt spill?"))reset()};reset();
</script></body></html>
