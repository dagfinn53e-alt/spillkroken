const $=id=>document.getElementById(id),KEY="spillglede-matquiz-v1";
let round=[],i=0,score=0,locked=false,seconds=7,tick=null,advance=null,paused=false,phase="question",history=[];
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function clearTimers(){clearInterval(tick);clearTimeout(advance)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({round,i,score,seconds,locked,paused,phase,history}))}catch(e){}}
function start(){clearTimers();let lev=$("lev").value,n=Number($("length").value);round=shuffle(Q.map((q,id)=>({q,id})).filter(x=>lev==="Blandet"||x.q[0]===lev)).slice(0,n).map(x=>x.id);i=0;score=0;seconds=7;locked=false;paused=false;phase="question";history=[];save();show()}
function draw(){let q=Q[round[i]];$("progress").textContent="Spørsmål "+(i+1)+" av "+round.length;$("score").textContent="Poeng: "+score;$("fill").style.width=(i/round.length*100)+"%";$("level").textContent=q[0];$("question").textContent=q[1];$("answers").innerHTML="";$("feedback").textContent="";$("explain").textContent="";$("count").textContent="";let choices=shuffle(q.slice(2,6));choices.forEach(answer=>{let b=document.createElement("button");b.className="answer";b.textContent=answer;b.onclick=()=>choose(b,answer);$("answers").appendChild(b)})}
function show(){clearTimers();$("pause").textContent="⏸ Pause";if(i>=round.length){finish();return}locked=false;paused=false;phase="question";seconds=7;draw();countdown();save()}
function countdown(){$("clock").textContent="⏱️ "+seconds+" sek";clearInterval(tick);tick=setInterval(()=>{if(paused)return;seconds--;$("clock").textContent="⏱️ "+seconds+" sek";save();if(seconds<=0){choose(null,null)}},1000)}
function choose(btn,answer){if(locked||paused)return;locked=true;phase="feedback";clearInterval(tick);let q=Q[round[i]];document.querySelectorAll(".answer").forEach(el=>{el.disabled=true;if(el.textContent===q[2])el.classList.add("right")});if(answer===q[2]){score++;$("feedback").textContent="✅ Riktig!"}else if(answer===null){$("feedback").textContent="⏰ Tiden er ute! Riktig svar: "+q[2]}else{btn.classList.add("wrong");$("feedback").textContent="Riktig svar: "+q[2]}$("score").textContent="Poeng: "+score;$("explain").textContent=q[6];$("clock").textContent="";$("count").textContent="Neste spørsmål om 2 sekunder …";history.push({i,answer});save();advance=setTimeout(()=>{i++;show()},2000)}
function finish(){clearTimers();phase="done";$("progress").textContent="Fullført";$("level").textContent="🏆 Resultat";$("question").textContent="Du fikk "+score+" av "+round.length+" riktige!";$("answers").innerHTML="";$("feedback").textContent="";$("explain").textContent="";$("count").textContent="";$("clock").textContent="";$("fill").style.width="100%";$("pause").style.display="none";save()}
function pause(){if(i>=round.length)return;if(paused){paused=false;$("pause").textContent="⏸ Pause";if(phase==="question"){countdown()}else{advance=setTimeout(()=>{i++;show()},2000)} }else{paused=true;clearTimers();$("pause").textContent="▶ Fortsett";$("clock").textContent="⏸ Pauset";}save()}
$("start").onclick=()=>{if(round.length&&i<round.length&&!confirm("Starte en ny runde? Den pågående runden blir erstattet."))return;start()};
$("pause").onclick=pause;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&!paused&&i<round.length)pause()});
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.round)&&saved.round.length&&saved.round.every(id=>Number.isInteger(id)&&id>=0&&id<Q.length)){round=saved.round;i=saved.i;score=saved.score;history=saved.history||[];if(i>=round.length)finish();else{draw();paused=true;phase="question";seconds=saved.phase==="feedback"?7:Math.max(1,Math.min(7,saved.seconds||7));$("clock").textContent="⏸ Pauset – "+seconds+" sek igjen";$("pause").textContent="▶ Fortsett";$("feedback").textContent="Runden er lagret. Trykk Fortsett.";}}else start()}catch(e){start()}
