<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figurrekker TEST – Spillglede</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#e9f6ff,#fff7d8 55%,#eee7ff);color:#142844;min-height:100vh}
.wrap{max-width:1000px;margin:auto;padding:18px}.back{display:inline-block;background:#17345d;color:white;text-decoration:none;padding:10px 16px;border-radius:13px;font-weight:900}
h1{text-align:center;font-size:clamp(38px,7vw,64px);margin:10px 0 3px}.sub{text-align:center;font-weight:800}.panel{background:#fffdf6;border:3px solid #e2b84f;border-radius:24px;padding:18px;box-shadow:0 9px 25px #18304b22}
.setup{display:flex;gap:12px;justify-content:center;align-items:end;flex-wrap:wrap}label{display:block;font-weight:900}select{font-size:17px;padding:9px;border:2px solid #17345d;border-radius:11px}button{cursor:pointer;font-weight:900;border-radius:14px;padding:12px;border:0;font-size:18px}.start{background:#f1c84b}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.player{background:white;border:3px solid #bccbdd;border-radius:16px;padding:10px;text-align:center;font-weight:900}.active{background:#fff0a8;border-color:#dca900}.score{font-size:21px}
.turn{margin:8px auto;width:max-content;background:#17345d;color:white;padding:8px 15px;border-radius:999px;font-weight:900}.question{text-align:center;font-weight:900;font-size:20px;margin-top:20px}
.pattern{text-align:center;font-size:clamp(30px,6vw,52px);line-height:1.5;margin:15px 0 20px;min-height:80px;overflow-wrap:anywhere}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;margin:auto}.answer{background:#edf5ff;border:3px solid #9eb5d0;min-height:75px;font-size:clamp(24px,4vw,36px)}.good{background:#bdf0c8!important;border-color:#39a55a!important}.bad{background:#ffd0d0!important;border-color:#d64b4b!important}
.msg,.progress{text-align:center;font-weight:900}.msg{min-height:44px;font-size:19px;margin:12px}
.overlay{position:fixed;inset:0;background:#10213dcc;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:#fffdf4;border:4px solid #f1c84b;border-radius:25px;padding:25px;text-align:center;max-width:500px;width:100%}.modal button{background:#17345d;color:white;margin:5px}
@media(max-width:700px){.players{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.answers,.players{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><a class="back" href="index.html">← Spillglede</a><h1>🔷 FIGURREKKER</h1><p class="sub">Se mønsteret – hvilken figur kommer neste?</p>
<div class="panel"><div class="setup"><div><label>Spillere</label><select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><button class="start" onclick="startGame()">Start test</button></div>
<div id="players" class="players"></div><div id="turn" class="turn"></div><div class="question">Hvilken figur kommer neste?</div><div id="pattern" class="pattern"></div><div id="answers" class="answers"></div><div id="msg" class="msg"></div><div id="progress" class="progress"></div></div></div>
<div id="overlay" class="overlay"><div class="modal"><h2 id="title"></h2><div id="result"></div><button onclick="startGame()">Spill igjen</button></div></div>
<script>
const BANK=[{"q": "🔴　🔵　🔴　🔵　🔴　❓", "correct": "🔵", "wrong": ["🔴", "🟢", "⭐"], "explain": "Fargene skifter mellom rød og blå."}, {"q": "🔴　🔴　🔵　🔴　🔴　🔵　❓", "correct": "🔴", "wrong": ["🔵", "🟢", "🟡"], "explain": "Mønsteret er to røde, så én blå."}, {"q": "🔺　🔺🔺　🔺🔺🔺　❓", "correct": "🔺🔺🔺🔺", "wrong": ["🔺🔺", "🔺🔺🔺", "🔺🔺🔺🔺🔺"], "explain": "Det kommer én trekant ekstra hver gang."}, {"q": "⭐　🌙　⭐　🌙　⭐　❓", "correct": "🌙", "wrong": ["⭐", "☀️", "🔵"], "explain": "Stjerne og måne kommer annenhver gang."}, {"q": "🟦　🟦🟦　🟦🟦🟦　❓", "correct": "🟦🟦🟦🟦", "wrong": ["🟦🟦", "🟦🟦🟦", "🟦🟦🟦🟦🟦"], "explain": "Antall firkanter øker med én."}, {"q": "🔺　🔵　🟩　🔺　🔵　❓", "correct": "🟩", "wrong": ["🔺", "🔵", "⭐"], "explain": "Tre figurer gjentas i samme rekkefølge."}, {"q": "⬆️　➡️　⬇️　⬅️　⬆️　❓", "correct": "➡️", "wrong": ["⬇️", "⬅️", "⬆️"], "explain": "Pilen dreier 90 grader med klokken."}, {"q": "⚫　⚪　⚪　⚫　⚪　⚪　❓", "correct": "⚫", "wrong": ["⚪", "🔴", "🔵"], "explain": "Én svart etterfølges av to hvite."}, {"q": "🔴　🔵🔵　🔴　🔵🔵　❓", "correct": "🔴", "wrong": ["🔵", "🔵🔵", "🔴🔴"], "explain": "Én rød og to blå gjentas."}, {"q": "⭐　⭐⭐　⭐⭐⭐　⭐⭐⭐⭐　❓", "correct": "⭐⭐⭐⭐⭐", "wrong": ["⭐⭐⭐", "⭐⭐⭐⭐", "⭐⭐⭐⭐⭐⭐"], "explain": "Det kommer én stjerne ekstra."}, {"q": "🔺　🔻　🔺　🔻　🔺　❓", "correct": "🔻", "wrong": ["🔺", "◀️", "▶️"], "explain": "Trekanten peker vekselvis opp og ned."}, {"q": "🟢　🟡　🔴　🟢　🟡　❓", "correct": "🔴", "wrong": ["🟢", "🟡", "🔵"], "explain": "Grønn, gul og rød gjentas."}];let game=[],idx=0,turn=0,n=2,scores=[],locked=false;const $=x=>document.getElementById(x);
function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){n=+$('count').value;scores=Array(n).fill(0);idx=turn=0;game=sh([...BANK]);$('overlay').style.display='none';show()}
function render(){$('players').innerHTML=scores.map((s,i)=>`<div class="player ${i===turn?'active':''}">🔷 Spiller ${i+1}<div class="score">${s} poeng</div></div>`).join('');$('turn').textContent=`Spiller ${turn+1} sin tur`}
function show(){if(idx>=game.length)return finish();locked=false;let q=game[idx];$('pattern').textContent=q.q;$('msg').textContent='';$('progress').textContent=`Testoppgave ${idx+1} av ${game.length}`;$('answers').innerHTML='';sh([q.correct,...q.wrong]).forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>answer(b,o);$('answers').appendChild(b)});render()}
function answer(b,o){if(locked)return;locked=true;let q=game[idx];if(o===q.correct){scores[turn]++;b.classList.add('good');$('msg').textContent='✅ Riktig! '+q.explain}else{b.classList.add('bad');[...$('answers').children].forEach(x=>{if(x.textContent===q.correct)x.classList.add('good')});$('msg').textContent='❌ '+q.explain}render();setTimeout(()=>{idx++;turn=(turn+1)%n;show()},1700)}
function finish(){let m=Math.max(...scores),w=scores.map((s,i)=>s===m?i+1:null).filter(Boolean);$('title').textContent=w.length>1?'🤝 Uavgjort!':'🏆 Test ferdig!';$('result').innerHTML=(w.length>1?`Spiller ${w.join(' og ')} deler seieren.`:`Spiller ${w[0]} vant!`)+'<br><br>'+scores.map((s,i)=>`Spiller ${i+1}: <b>${s} poeng</b>`).join('<br>');$('overlay').style.display='flex'}
startGame();
</script></body></html>
