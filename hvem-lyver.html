function show(){if(i>=game.length){$("story").textContent="🏆 Spillet er ferdig!";$("people").innerHTML="";$("answers").innerHTML="";$("msg").textContent="Du fikk "+pts+" av "+game.length+" riktige.";$("prog").textContent="Ferdig";$("score").textContent="Poeng: "+pts;$("why").style.display="none";return}locked=false;let q=game[i];$("prog").textContent="Oppgave "+(i+1)+" av "+game.length;$("score").textContent="Poeng: "+pts;$("story").innerHTML="<b>🔎 "+q.title+"</b><br>"+q.intro;$("people").innerHTML="";q.people.forEach(x=>$("people").innerHTML+=`<div class="person"><b>👤 ${x[0]}</b><p>«${x[1]}»</p></div>`);$("answers").innerHTML="";q.people.forEach(x=>$("answers").innerHTML+=`<button onclick="pick('${x[0]}')">${x[0]}</button>`);$("msg").textContent="Hvem lyver?";$("why").style.display="none"}
function pick(n){if(locked)return;locked=true;let q=game[i];if(n===q.liar){pts++;$("msg").textContent="✅ Riktig! "+n+" lyver."}else $("msg").textContent="❌ Ikke riktig. "+q.liar+" lyver.";$("score").textContent="Poeng: "+pts;$("why").textContent="💡 Forklaring: "+q.why;$("why").style.display="block";setTimeout(()=>{i++;show()},3200)}start();</script></body></html>
