<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory – Spillglede</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#3b70a0,#152d4a 70%);text-align:center}h1{font-size:clamp(42px,7vw,72px);margin:14px 0 4px;color:#ffe36c;text-shadow:0 4px #17304d}.top,.opts,.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.btn{border:3px solid #ffe07a;border-radius:22px;padding:9px 15px;font-weight:900;background:#fff1b5;color:#17304d;cursor:pointer;text-decoration:none}.btn.active{background:#42c965;color:white}.turn{font-size:23px;font-weight:900;color:#ffe76b;margin:12px}.playerscore{padding:8px 13px;border-radius:15px;background:#244b70;border:2px solid #699bc7;font-weight:bold}.playerscore.active{background:#2fa653;border-color:#ffe36c}.board{max-width:760px;margin:15px auto 30px;display:grid;gap:10px;padding:10px}.card{aspect-ratio:1/1;border:0;background:transparent;perspective:700px;cursor:pointer}.inner{width:100%;height:100%;position:relative;transition:.35s;transform-style:preserve-3d}.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;border:4px solid #ffd85b;box-shadow:0 5px 8px #0006}.back{background:linear-gradient(135deg,#e65b42,#9b2e68);font-size:40px}.front{background:#fff8dc;color:#222;transform:rotateY(180deg);font-size:clamp(34px,7vw,60px)}.matched .front{background:#c9f5ce}.info{font-weight:bold}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10}.overlay.show{display:flex}.box{background:linear-gradient(#fff3ae,#e3a72f);color:#17304d;border:6px solid #714414;border-radius:25px;padding:25px;max-width:520px}.box h2{font-size:38px;margin:0 0 10px}@media(max-width:600px){.board{gap:6px}.back{font-size:28px}}</style></head><body>
<h1>🧠 MEMORY</h1><div class="opts"><span class="btn">Spillere:</span><button class="btn p active" onclick="setPlayers(1,this)">1</button><button class="btn p" onclick="setPlayers(2,this)">2</button><button class="btn p" onclick="setPlayers(3,this)">3</button><button class="btn p" onclick="setPlayers(4,this)">4</button></div>
<div class="opts"><button class="btn d" onclick="setLevel(6,this)">🐣 Lett · 6 par</button><button class="btn d active" onclick="setLevel(8,this)">🐾 Normal · 8 par</button><button class="btn d" onclick="setLevel(12,this)">🦁 Vanskelig · 12 par</button></div>
<div class="top"><button class="btn" onclick="newGame()">🔄 Nytt spill</button><a class="btn" href="index.html">🏠 Spillglede</a></div><div class="turn" id="turn"></div><div class="stats" id="scores"></div><div class="info" id="info"></div><div class="board" id="board"></div>
<div class="overlay" id="over"><div class="box"><h2>🏆 Spillet er ferdig!</h2><div id="result"></div><p><button class="btn" onclick="newGame()">🧠 Spill igjen</button> <a class="btn" href="index.html">🏠 Spillglede</a></p></div></div>
<script>
const animals=['🐶','🐱','🐼','🦊','🐸','🦁','🐵','🐧','🐰','🐨','🐯','🦄'];let np=1,pairs=8,player=0,pts=[],cards=[],first=null,second=null,lock=false,moves=0,found=0,start=0,timer;
function setPlayers(n,e){np=n;document.querySelectorAll('.p').forEach(x=>x.classList.remove('active'));e.classList.add('active');newGame()}
function setLevel(n,e){pairs=n;document.querySelectorAll('.d').forEach(x=>x.classList.remove('active'));e.classList.add('active');newGame()}
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){clearInterval(timer);player=0;pts=Array(np).fill(0);moves=found=0;first=second=null;lock=false;start=Date.now();over.classList.remove('show');let vals=animals.slice(0,pairs);cards=shuffle([...vals,...vals]).map((v,i)=>({v,i,open:false,matched:false}));render();timer=setInterval(update,1000)}
function render(){let cols=pairs===6?4:pairs===8?4:6;board.style.gridTemplateColumns=`repeat(${cols},1fr)`;board.innerHTML='';cards.forEach((c,i)=>{let b=document.createElement('button');b.className='card'+(c.open?' open':'')+(c.matched?' matched':'');b.innerHTML='<div class="inner"><div class="face back">?</div><div class="face front">'+c.v+'</div></div>';b.onclick=()=>flip(i);board.appendChild(b)});update()}
function flip(i){if(lock||cards[i].open||cards[i].matched)return;cards[i].open=true;if(first===null){first=i;render();return}second=i;moves++;render();lock=true;if(cards[first].v===cards[second].v){setTimeout(()=>{cards[first].matched=cards[second].matched=true;found++;pts[player]++;first=second=null;lock=false;if(found===pairs)finish();else render()},550)}else{setTimeout(()=>{cards[first].open=cards[second].open=false;first=second=null;player=(player+1)%np;lock=false;render()},900)}}
function update(){turn.textContent=np===1?'Finn alle parene!':'🎯 Spiller '+(player+1)+' sin tur';scores.innerHTML=pts.map((x,i)=>'<span class="playerscore '+(i===player?'active':'')+'">Spiller '+(i+1)+': '+x+' par</span>').join('');let sec=Math.floor((Date.now()-start)/1000);info.textContent='Forsøk: '+moves+' · Funnet: '+found+' / '+pairs+' · Tid: '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function finish(){clearInterval(timer);let best=Math.max(...pts),wins=pts.map((x,i)=>x===best?i+1:null).filter(Boolean);result.innerHTML=np===1?'Du fant alle '+pairs+' parene! 🎉':(wins.length>1?'🤝 Uavgjort mellom spiller '+wins.join(' og ')+'!':'🥇 Spiller '+wins[0]+' vinner!')+'<br><br>'+pts.map((x,i)=>'Spiller '+(i+1)+': <b>'+x+' par</b>').join('<br>');over.classList.add('show')}
newGame()</script></body></html>
